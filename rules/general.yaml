  - category_id: nuclearmedicine_other
    parent_category_id: nuclearmedicine
    conditions:
      - operator: contains_any
        field: modality
        value: ['NM', 'PT', 'PET']

drop_rules:
  - name: '골밀도 검사 제외'
    description: '검사종류(modality)가 BD, BMD, BDUS인 골밀도 검사는 판독목록에서 제외'
    field: modality
    operator: equals_any
    value: ['BD', 'BMD', 'BDUS']

  - name: '내시경 검사 제외'
    description: '검사종류(modality)가 ES인 내시경 검사는 판독목록에서 제외'
    field: modality
    operator: equals
    value: 'ES'

  - name: '안과 검사 제외'
    description: '검사종류(modality)가 FP, OCT, OP, OPT인 안과 검사는 판독목록에서 제외'
    field: modality
    operator: equals_any
    value: ['FP', 'OCT', 'OP', 'OPT']

  - name: '치과 검사 제외'
    description: '검사종류(modality)가 IO, PX인 치과 검사는 판독목록에서 제외'
    field: modality
    operator: equals_any
    value: ['IO', 'PX']

# CSV/Excel 내보내기 설정
export_as_sheet:
  default_format: 'csv' # 기본 내보내기 형식
  encoding: 'utf-8' # 파일 인코딩
  filename:
    pattern: 'logbook_export_{date}_{time}'
    date_format: 'YYYY-MM-DD'
    time_format: 'HH-mm-ss'
  templates:
    - name: 'for_record2'
      export_site: record2
      description: 'record2 사이트 업로드용 (예시 엑셀 파일과 동일한 구조)'
      column_order:
        - 'serial_number'
        - 'modality'
        - 'specialty'
        - 'sex'
        - 'study_date'
        - 'reading_date'
        - 'exam_name'

      columns:
        - serial_number:
            name: '일련번호'
            type: 'number'
            width: 8
            value:
              auto_increment:
                start_value: 1
                increment: 1
        - modality:
            name: '검사종류'
            type: 'string'
            width: 12
            value:
              from_metadata:
                key: examination_type_name
            is_classifier: true
            map_to_export_target: true
        - specialty:
            name: '세부전공'
            type: 'string'
            width: 12
            value:
              conditional:
                conditions:
                  - condition:
                      field: 'specialty_name'
                      operator: 'is_null'
                    value_source:
                      from_metadata:
                        key: 'examination_type_name'
                default:
                  from_metadata:
                    key: 'specialty_name'
            is_classifier: true
            map_to_export_target: true
        - sex:
            name: '환자성별(M/F)'
            type: 'string'
            width: 8
            value:
              fallback_chain:
                - from_field:
                    field: 'sex'
                - static:
                    value: 'N/A'
        - study_date:
            name: '검사일(년-월-일)'
            type: 'date'
            width: 12
            date_format: 'YYYY-MM-DD'
            value:
              from_field:
                field: 'study_date'
        - reading_date:
            name: '판독일(년-월-일)'
            type: 'date'
            width: 12
            date_format: 'YYYY-MM-DD'
            value:
              from_field:
                field: 'reading_date'
        - exam_name:
            name: '검사명'
            type: 'string'
            width: 20
            value:
              fallback_chain:
                - from_field:
                    field: 'exam_name'
                - static:
                    value: '검사명 없음'
      ajax_template: |
        $.ajax({
          url: "/major/reading/handle/reading_A_upsert.php",
          type: "POST",
          data: {
            sid: "",
            gubun: {{modality}},
            kind: {{specialty}},
            reading_count: {{count}},
            sdate: "{{start_date}}",
            edate: "{{end_date}}"
          },
          dataType: "text",
          success: function(e) {
            console.log("{{modality}} | {{specialty}} 업로드 완료");
          }
        });
    - name: 'for_record2020'
      export_site: record2020
      description: 'record2020 사이트 업로드용 (예시 엑셀 파일과 동일한 구조)'

      column_order:
        - 'serial_number'
        - 'modality'
        - 'specialty'
        - 'age_group'
        - 'sex'
        - 'study_date'
        - 'reading_date'
        - 'exam_name'

      columns:
        # 일련번호 (자동 생성)
        - serial_number:
            name: '일련번호'
            type: 'number'
            width: 8
            value:
              auto_increment:
                start_value: 1
                increment: 1

        # 검사종류 (메타데이터에서 가져오기)
        - modality:
            name: '검사종류'
            type: 'string'
            width: 12
            value:
              from_metadata:
                key: examination_type_name
            is_classifier: true
            map_to_export_target: true

        # 세부전공 (소아의 경우 하위 세부전공 사용)
        - specialty:
            name: '세부전공'
            type: 'string'
            width: 12
            value:
              conditional:
                conditions:
                  - condition:
                      field: 'specialty_name'
                      operator: 'is_null'
                    value_source:
                      from_metadata:
                        key: 'examination_type_name'
                  - condition:
                      field: 'specialty_name'
                      operator: 'equals'
                      value: '소아'
                    value_source:
                      from_metadata:
                        key: 'remarks_name'
                  - condition:
                      field: 'specialty_name'
                      operator: 'not_equals'
                      value: '소아'
                    value_source:
                      from_metadata:
                        key: 'specialty_name'
                default:
                  from_metadata:
                    key: 'specialty_name'
            is_classifier: true
            map_to_export_target: true

        # 소아/성인 구분
        - age_group:
            name: '소아/성인'
            type: 'string'
            width: 8
            description: '소아(17세 미만) 또는 성인 구분'
            value:
              conditional:
                conditions:
                  - condition:
                      field: 'specialty_name'
                      operator: 'equals'
                      value: '소아'
                    value_source:
                      static:
                        value: '소아'
                  - condition:
                      field: 'specialty_name'
                      operator: 'not_equals'
                      value: '소아'
                    value_source:
                      static:
                        value: '성인'
                default:
                  static:
                    value: '성인'
            is_classifier: true

        # 환자성별 (데이터 필드에서 가져오기)
        - sex:
            name: '환자성별(M/F)'
            type: 'string'
            width: 8
            value:
              fallback_chain:
                - from_field:
                    field: 'sex'
                - static:
                    value: 'N/A'

        # 검사일 (데이터 필드에서 가져오기)
        - study_date:
            name: '검사일(년-월-일)'
            type: 'date'
            width: 12
            date_format: 'YYYY-MM-DD'
            value:
              from_field:
                field: 'study_date'

        # 판독일 (데이터 필드에서 가져오기)
        - reading_date:
            name: '판독일(년-월-일)'
            type: 'date'
            width: 12
            date_format: 'YYYY-MM-DD'
            value:
              from_field:
                field: 'reading_date'

        # 검사명 (fallback chain으로 가져오기)
        - exam_name:
            name: '검사명'
            type: 'string'
            width: 20
            value:
              fallback_chain:
                - from_field:
                    field: 'exam_name'
                - static:
                    value: '검사명 없음'
      ajax_template: |
        $.ajax({
          data: 'mode=insert&user_idx='+$("input[name='user_idx']").val()+
                '&step_num=4&x_scan_type={{modality}}&x_major_type={{specialty}}&x_adult_yumu={{age_group}}&x_scan_cnt={{count}}&x_check_date=&x_scan_title=&x_reading_date={{start_date}}&x_reading_date_2={{end_date}}',
          dataType: "text",
          contentType: "application/x-www-form-urlencoded; charset=UTF-8",
          success: function(e) {
            console.log("{{modality}}/{{specialty}}/{{age_group}} 업로드 완료");
          }
        });

      # record2020은 서버가 값을 검증하지 않고 그대로 저장합니다.
      # 유효값은 정적 자산에 고정돼 있고(값을 여기에 복제하지 않습니다),
      # 틀린 값이 조용히 쌓이는 것을 잡아 검증에만 씁니다.
      direct_registration_validation:
        fields: { modality: 'x_scan_type', specialty: 'x_major_type' }
        source: 'record2020'

  - category_id: intervention
    priority: 0
    composed_by_subcategories: true
  - category_id: intervention_neu
    parent_category_id: intervention
    # 'Angiography' 단독으로는 뇌혈관 시술로 볼 수 없다. 경동맥 조영 같은 다른 혈관
    # 시술까지 잡으므로 뇌혈관/경내 시술 표현만 받는다.
    conditions:
      - operator: contains_any
        field: exam_name
        value:
          [
            '뇌혈관조영술',
            'Vessel Angiography',
            'Internal Carotid Angiography',
            '신경중재',
            'Cerebral',
            'TFCA',
            '총경동맥',
            'Common carotid',
            'carotid angiography',
            '뇌동맥류',
            'Flow diverter'
          ]
      # 검사명에 CT가 명시된 경우("CT,Head angiography")는 CT 혈관조영이다
      - operator: regex
        field: exam_name
        value: '^(?:(?!.*\bct\b)[\s\S])*$'
        regex_flags: 'i'
  - category_id: intervention_thyroid
    parent_category_id: intervention
    conditions:
      - operator: contains_any
        field: exam_name
        value: ['갑상선', 'thyroid']
      - operator: contains_any
        field: exam_name
        value:
          [
            '침생검',
            '세침흡인술',
            '흡인생검',
            '생검',
            '흡인',
            'biopsy',
            'FNA',
            'needle aspiration',
            '조직검사'
          ]
  - category_id: intervention_us
    parent_category_id: intervention
    conditions:
      - operator: contains
        field: modality
        value: 'US'
      - operator: contains_any
        field: exam_name
        value: ['생검', '조직검사', 'Biopsy', 'aspiration', '흡인']
  - category_id: intervention_ct
    parent_category_id: intervention
    conditions:
      - operator: contains
        field: modality
        value: 'CT'
      - operator: contains_any
        field: exam_name
        value: ['생검', '조직검사', 'Biopsy']
  - category_id: intervention_intu
    parent_category_id: intervention
    conditions:
      - operator: contains_any
        field: exam_name
        value: ['장중첩', 'Intussusception']
  - category_id: intervention_cfa
    parent_category_id: intervention
    conditions:
      - operator: contains_any
        field: exam_name
        value: ['대퇴동맥', 'Femoral', 'Puncture']
  - category_id: intervention_angio
    parent_category_id: intervention
    conditions:
      - operator: contains_any
        field: modality
        value: ['DS', 'XA', 'ANGIO', 'RF', 'XA/US', 'US/XA', 'IV']
      - operator: contains_any
        field: exam_name
        value:
          [
            '혈관조영',
            'Angiography',
            'arteriography',
            'Arteriography',
            'Embolization',
            'TACE',
            'TACI',
            'UAE',
            'BAE',
            'aortography',
            'transluminal angioplasty',
            'Transluminal Angioplasty'
          ]
      # 검사명에 CT가 명시된 경우("Angiographic CT")는 CT 혈관조영이다
      - operator: regex
        field: exam_name
        value: '^(?:(?!.*\bct\b)[\s\S])*$'
        regex_flags: 'i'
  - category_id: intervention_biliary
    parent_category_id: intervention
    priority: 5
    conditions:
      - operator: not_contains
        field: exam_name
        value: 'portography'
      - logic: OR
        conditions:
          # PTBD/GBD 는 시술 명칭 자체이므로 진단검사와 겹치지 않는다
          - operator: contains_any
            field: exam_name
            value:
              ['PTBD', 'GBD', 'Cholecystostomy', 'choledochostomy', 'Transhepatic', 'transhepatic']
          # 담도/담낭 키워드는 진단검사에도 흔하다
          # ("Abdomen US(간,담낭,담도,...)", "Biliarypancreas MRI Enhance").
          # 그래서 시술 검사(CT/MR/US)일 때는 진단검사로 보고, 시술 modality일 때만
          # 담도 시술로 본다.
          - logic: AND
            conditions:
              - operator: contains_any
                field: exam_name
                value: ['담도', '담낭', 'biliary', 'transhepatic', 'cholecystostomy']
              - operator: not_contains_any
                field: modality
                value: ['US', 'CT', 'MR', 'NM']
              - operator: not_contains_any
                field: exam_name
                value: ['Scan', '스캔', 'SPECT', 'PET']
  - category_id: intervention_pcn
    parent_category_id: intervention
    conditions:
      - operator: contains_any
        field: exam_name
        value: ['신우', 'PCN', 'Nephrostomy']
  - category_id: intervention_drain
    parent_category_id: intervention
    priority: 5
    # taxonomy: "그 외 경피적 배액술 (흉수천자, 복수천자, 농양천자 등)"
    # 초음파 유도 천자도 배액술이므로 intervention_us 가 아니라 이 항목에 모은다.
    conditions:
      - operator: contains_any
        field: exam_name
        value:
          [
            '배액',
            'Drainage',
            'drain',
            'Aspiration',
            'PCD',
            '복막천자',
            '흉막천자',
            'Chest tube',
            'Chest aspiration',
            'Cystostomy',
            'tube change',
            '천자'
          ]
      # 신우/간경유 배액 및 갑상선/생검은 배액이 아니라 각자의 시술로 집계한다
      - operator: not_contains_any
        field: exam_name
        value:
          [
            'nephrostomy',
            'transhepatic',
            'cholecystostomy',
            'Nephrostomy',
            '신우',
            'Thyroid',
            'thyroid',
            '갑상선',
            '생검',
            'biopsy',
            '조직검사',
            'Sclerotherapy',
            'sclerotherapy',
            '경화',
            '경화술'
          ]
      # 단순 초음파 확인/표시 행은 배액술이 아닌 초음파 진단검사로 분류한다
      - operator: not_contains_any
        field: exam_name
        value: ['단순Ⅰ', '단순Ⅱ', '단순 I', '단순 II', 'Simple US']
  - category_id: intervention_cvc
    parent_category_id: intervention
    # taxonomy: "중심정맥 카테터 삽입술"
    # 검사명에 "혈관조영술"이 함께 붙어 있어 intervention_angio 보다 먼저 평가해야 한다.
    # (병원 확인: 혈관조영술하 쇄골하정맥/내경정맥 삽입술도 이 항목)
    priority: 2
    conditions:
      - operator: contains_any
        field: exam_name
        value:
          [
            '중심정맥',
            '쇄골하정맥',
            '내경정맥',
            'CVC',
            'Hickman',
            'Permcath',
            'Perm catheter',
            'PICC',
            'Central Vein Catheter',
            'Catheterization',
            'Hemodialysis',
            'Chemo Port',
            'Chemoport'
          ]
      - operator: not_contains
        field: exam_name
        value: 'IVC filter'
  - category_id: intervention_tumor
    parent_category_id: intervention
    # taxonomy: "영상유도하 종양치료 (알코올경화술, 고주파열치료, 마이크로웨이브, HIFU 등)"
    # 알코올경화술 및 낭종 경화술(Sclerotherapy) 포함 (단, 혈관기형은 제외)
    conditions:
      - operator: contains_any
        field: exam_name
        value:
          [
            'RFA',
            'MWA',
            'HIFU',
            'Ablation',
            '고주파',
            '경화',
            'Sclerotherapy',
            'sclerotherapy',
            '경화술',
            'PEI',
            '에탄올',
            '알코올'
          ]
      - operator: not_contains_any
        field: exam_name
        value: ['혈관기형', 'malformation', 'Malformation', 'AVM']
  - category_id: intervention_etc
    parent_category_id: intervention
    # 이 규칙은 modality 만으로 시술을 잡는 catch-all 이므로 가장 마지막에 평가되어야
    # 한다. 우선순위를 지정하지 않으면 기본값 10 이 되어 형제 규칙(중심적맥 등)보다
    # 먼저 평가되고, 그 규칙들이 놓친 행을 이쪽이 먼저 가져간다.
    priority: 999
    conditions:
      - operator: contains_any
        field: modality
        value: ['DS', 'XA']
      - operator: not_contains_any
        field: exam_name
        value: ['Simple US', 'Guiding US', 'Skull']
      # 검사명에 CT가 명시된 경우("Angiographic CT")는 시술이 아닌 CT 혈관조영이다
      - operator: regex
        field: exam_name
        value: '^(?:(?!.*\bct\b)[\s\S])*$'
        regex_flags: 'i'

  - category_id: nuclearmedicine

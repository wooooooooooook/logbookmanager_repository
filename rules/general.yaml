  - category_id: ultrasound_thyroid
    parent_category_id: ultrasound
    priority: 9
    conditions:
      # 소아 판독실과 만 17세 미만은 소아 갑상선(ultrasound_ped_thyroid)으로 보낸다
      - operator: not_equals
        field: assign
        value: 'Pediatrics'
      - logic: OR
        conditions:
          - operator: greaterThan
            field: age
            value: 16
          - operator: is_null
            field: age
      - operator: contains_any
        field: exam_name
        value: ['thyroid', 'parathyroid', '갑상선', '부갑상선']
      - operator: not_contains_any
        field: exam_name
        value: ['aspiration', 'biopsy', '생검', '흡인', '갑상선·부갑상선 제외']
  - category_id: ultrasound_abd

classification_rules:
  # 데이터 검증 규칙 (최우선 적용)
  - category_id: xray
    conditions:
      - operator: contains_any
        field: modality
        value: ['CR', 'DR', 'DX', 'RG', 'X-RAY', 'XRAY', 'DT', 'XA/CR']
  - category_id: xray_neu
    parent_category_id: xray
    # 판독실이 기준이다: 신경 판독실(Neuro/NEU/H&N)이 판독한 검사는 신경 X-ray로 집계한다.
    # 다만 검사명이 명백한 근골격이면 근골격을 우선한다.
    # (A병원 확인: "assign을 기준으로 보는것이 맞음" + "NEU라도 명백한 msk는 msk로분류")
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: contains_any
                field: assign
                value: ['Neuro', 'NEU', 'H&N']
              # 흉부·복부·척추는 신경 판독실이 받아도 해당 부위로 보낸다
              - operator: not_contains_any
                field: exam_name
                value: ['Chest', 'Abdomen', 'Spine']
              # 명백한 사지/관절 X-ray는 근골격으로 보낸다 (T-M Joint, DXR Foot 등)
              - operator: not_contains_any
                field: exam_name
                value:
                  [
                    'ankle',
                    'shoulder',
                    'clavicle',
                    'humerus',
                    'joint',
                    'elbow',
                    'femur',
                    'foot',
                    'forearm',
                    'wrist',
                    'hand',
                    'finger',
                    'hip',
                    'knee',
                    'leg',
                    'pelvis',
                    'rib',
                    'coccyx',
                    'extremity',
                    'toe'
                  ]
          - operator: contains_any
            field: exam_name
            value:
              [
                'skull',
                'neck',
                'pns',
                'mastoid',
                't - m joint',
                't-m joint',
                'tm joint',
                'tmj',
                'mandible'
              ]
  - category_id: xray_cht
    parent_category_id: xray
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: contains_any
                field: assign
                value: ['CHT', 'Chest', 'Thorax']
              - operator: not_contains_any
                field: exam_name
                value:
                  [
                    'Abdomen',
                    'K.U.B',
                    'KUB',
                    'Shoulder',
                    'Knee',
                    'Ankle',
                    'Foot',
                    'Spine',
                    'Pelvis',
                    'Femur',
                    'Infantogram',
                    'infantogram'
                  ]
          - operator: contains
            field: exam_name
            value: 'Chest'
  - category_id: xray_abd
    parent_category_id: xray
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: contains_any
                field: assign
                value: ['ABD', 'Abdomen']
              - operator: not_contains_any
                field: exam_name
                value:
                  [
                    'Shoulder',
                    'Knee',
                    'Ankle',
                    'Foot',
                    'Wrist',
                    'Elbow',
                    'Hand',
                    'Finger',
                    'Femur',
                    'Tibia',
                    'Pelvis',
                    'pelvis',
                    'leg',
                    'Leg',
                    'hip',
                    'Hip',
                    'arm',
                    'Arm',
                    'extremity',
                    'joint',
                    'Joint',
                    'clavicle',
                    'humerus',
                    'radius',
                    'ulna',
                    'fibula'
                  ]
          - operator: contains_any
            field: exam_name
            value: ['Abdomen', 'CTTS']
  - category_id: xray_kub
    parent_category_id: xray
    priority: 2
    conditions:
      - operator: contains_any
        field: exam_name
        value: ['KUB', 'K.U.B']
  - category_id: xray_spine
    parent_category_id: xray
    priority: 2
    conditions:
      - operator: contains_any
        field: exam_name
        value: ['Spine', 'C-spine', 'T-spine', 'L-spine', 'atlas', 'SPINE']
  - category_id: xray_msk
    parent_category_id: xray
    conditions:
      # Infantogram(신생아 전신)은 근골격으로 잡지 않고 기타로 보낸다
      - operator: not_contains
        field: exam_name
        value: 'infantogram'
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: contains_any
                field: assign
                value: ['Musculoskeletal', 'MSK']
              - operator: not_contains_any
                field: exam_name
                value: ['Chest', 'Abdomen', 'Spine']
          - logic: AND
            conditions:
              - operator: equals
                field: assign
                value: 'Emergency'
              - operator: not_contains_any
                field: exam_name
                value:
                  [
                    'skull',
                    'neck',
                    'chest',
                    'abdomen',
                    'spine',
                    'pns',
                    'zygoma',
                    'sella',
                    'facial',
                    'mandible',
                    'mastoid'
                  ]
          - operator: contains_any
            field: exam_name
            value:
              [
                'ankle',
                'shoulder',
                'clavicle',
                'humerus',
                'joint',
                'elbow',
                'femur',
                'foot',
                'forearm',
                'wrist',
                'hand',
                'finger',
                'hip',
                'knee',
                'leg',
                'pelvis',
                'rib',
                'coccyx',
                'extremity',
                'whole skeletal',
                'teleradiogram',
                'toe',
                'Sacrum',
                'sacrum'
              ]
  - category_id: xray_ped
    parent_category_id: xray
    priority: 1
    # 나이가 있으면 나이를 기준으로 한다. 판독실(PED)만으로 소아로 보내면
    # 성인 환자를 소아로 집계하게 되므로, 나이 결측일 때만 판독실을 참조한다.
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: not_null
                field: age
              - operator: lessThan
                field: age
                value: 17
          - logic: AND
            conditions:
              - operator: is_null
                field: age
              - operator: contains_any
                field: assign
                value: ['Pediatrics', 'PED']
  - category_id: xray_ped_neu
    parent_category_id: xray_ped
    inherit_conditions_from: xray_neu
  - category_id: xray_ped_abd
    parent_category_id: xray_ped
    inherit_conditions_from: xray_abd
    conditions:
      - operator: not_contains
        field: exam_name
        value: 'Infantogram'
  - category_id: xray_ped_msk
    parent_category_id: xray_ped
    inherit_conditions_from: xray_msk
  - category_id: xray_ped_spine
    parent_category_id: xray_ped
    priority: 2
    inherit_conditions_from: xray_spine
  - category_id: xray_ped_cht
    parent_category_id: xray_ped
    inherit_conditions_from: xray_cht
    conditions:
      - operator: not_contains
        field: exam_name
        value: 'Infantogram'
  - category_id: xray_ped_kub
    parent_category_id: xray_ped
    # inherit_conditions_from 은 조건만 상속하므로 priority는 직접 지정해야 한다.
    # (KUB는 복부/비뇨 조건보다 먼저 평가되어야 한다)
    priority: 2
    inherit_conditions_from: xray_kub

  - category_id: mammography
    priority: 2
    composed_by_subcategories: true
  - category_id: mammography_mammography
    parent_category_id: mammography
    conditions:
      - operator: contains
        field: modality
        value: 'MG'
  - category_id: ct
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: contains
                field: modality
                value: 'CT'
              - operator: not_contains
                field: modality
                value: 'PT'
          # PACS 검사종류가 범용 코드(DS 등)라도 검사명에 CT가 명시되어 있으면 CT로 본다.
          - operator: regex
            field: exam_name
            value: '\bct\b'
            regex_flags: 'i'
      # PET-CT 는 CT 항목이 아니라 핵의학과(PET) 항목이다.
      # (병원 확인: "(FDG) Torso PET-CT" 는 nm_pet 으로 집계)
      # modality 에 CT/PT 가 함께 적혀 있어 위 조건을 통과하므로 여기서 막는다.
      - operator: not_contains
        field: exam_name
        value: 'PET'
  - category_id: ct_neu
    parent_category_id: ct
    conditions:
      - logic: OR
        conditions:
          - operator: contains_any
            field: assign
            value: ['Neuro', 'NEU', 'H&N']
          # 경상/흉부 판독실로 들어온 갑상선 CT는 두경부로 집계한다
          - operator: contains
            field: exam_name
            value: 'thyroid'
          - operator: contains_any
            field: exam_name
            value:
              [
                'brain',
                'facial',
                'nasal',
                'head',
                'neck',
                'orbit',
                'OMU',
                'PNS',
                'temporal bone',
                'pharynx',
                'bronchial',
                'salivary'
              ]
      # 경추 CT는 신경 CT가 아니라 척추 CT로 집계한다
      - operator: not_contains
        field: exam_name
        value: 'SPINE'
  - category_id: ct_cht
    parent_category_id: ct
    conditions:
      - logic: OR
        conditions:
          - operator: contains_any
            field: assign
            value: ['chest lung', 'CHT']
          - operator: contains_any
            field: exam_name
            value: ['chest', 'pulmonary embolism']
  - category_id: ct_cardiac
    parent_category_id: ct
    priority: 6
    conditions:
      - logic: OR
        conditions:
          - operator: contains_any
            field: assign
            value: ['chest CV', 'CARDIAC']
          - operator: contains_any
            field: exam_name
            value: ['cardiac', 'heart', 'coronary artery']
      - operator: not_contains_any
        field: exam_name
        value: ['aortic', 'aorta', 'angiography', 'pulmonary vein']
      # 흉부 판독실이면서 검사명도 흉부인 CT는 심장 CT가 아니라 흉부 CT로 집계한다.
      # 판독실이 심장전담(chest CV)인 경우에만 심장 CT다.
      - logic: OR
        conditions:
          - operator: not_equals
            field: assign
            value: 'CARDIAC'
          - operator: not_contains
            field: exam_name
            value: 'Chest'
  - category_id: ct_vas
    parent_category_id: ct
    priority: 5
    conditions:
      - logic: OR
        conditions:
          - operator: contains
            field: assign
            value: 'VAS'
          - operator: contains_any
            field: exam_name
            value:
              [
                'aortic',
                'aorta',
                'angiography',
                'angiographic',
                'pulmonary vein',
                'venography',
                'arteriography'
              ]
      # 두부 혈관조영은 신경두경부 CT로 집계한다
      - operator: not_contains_any
        field: exam_name
        value: ['head', 'brain', 'cranial', 'neck', 'carotid']
  - category_id: ct_abd
    parent_category_id: ct
    conditions:
      - operator: not_contains_any
        field: exam_name
        value: ['(uro)', '(Uro)']
      - logic: OR
        conditions:
          - operator: contains_any
            field: assign
            value: ['Abdomen', 'ABD']
          - operator: contains_any
            field: exam_name
            value: ['abdomen', 'liver', 'biliary', 'pancreas', 'enterography']
  - category_id: ct_gu
    parent_category_id: ct
    priority: 2
    conditions:
      - logic: OR
        conditions:
          - operator: contains_any
            field: assign
            value: ['Genitourinary', 'OBGY']
          # 'URO' 는 'Neuro' 의 부분문자열이므로 코드는 정확히 일치시켜야 한다
          - operator: equals_any
            field: assign
            value: ['URO', 'GU', 'UROLOGY']
          # 판독실이 복부(ABD)이고 의뢰과가 비뇨생식기과인 경우.
          # 판독실이 우선이다: 신경 판독실(NEU/HN)이 판독한 두경부 CT는
          # 의뢰과가 비뇨생식기과여도 신경 CT로 집계한다.
          # (병원 확인: "신경판독실이 판독한것은 신경 CT임 비뇨과는 관계없음")
          - logic: AND
            conditions:
              - operator: not_null
                field: department
              - operator: contains
                field: assign
                value: 'ABD'
              - operator: contains_any
                field: department
                value:
                  [
                    'NE',
                    'UR',
                    'OB',
                    '신장내과',
                    '비뇨의학과',
                    '산부인과',
                    'PUR',
                    'P-UR',
                    '소아비뇨의학과',
                    '소아비뇨기과'
                  ]
          - operator: contains_any
            field: exam_name
            value:
              [
                'urography',
                '(uro)',
                '(Uro)',
                ' uro',
                'urinary',
                'adrenal',
                'bladder',
                'kidney',
                'Kidney',
                'renal',
                'Renal',
                '요로',
                '결석',
                '신장',
                '방광',
                '전립선',
                '신우'
              ]
      # 의뢰과가 비뇨생식기과라도 검사명이 간/담낭/췌장 등 복부 장기를 지목하면 복부 CT다
      - operator: not_contains_any
        field: exam_name
        value: ['liver', 'biliary', 'pancreas', 'spleen', '간', '담낭', '담도', '췌장', '비장']
      # 혈관조영 CT(Renal Angiography 등)는 ct_vas로 분류한다
      - operator: not_contains_any
        field: exam_name
        value: ['angiography', 'angiographic', 'Angiography', 'angio', 'Angio']
  - category_id: ct_spine
    parent_category_id: ct
    priority: 2
    conditions:
      - operator: contains
        field: exam_name
        value: 'SPINE'
  - category_id: ct_msk
    parent_category_id: ct
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: contains_any
                field: assign
                value: ['Musculoskeletal', 'MSK']
              - operator: not_contains
                field: exam_name
                value: 'SPINE'
          - operator: contains_any
            field: exam_name
            value: ['extremity', 'pelvis', 'trauma', 'arthro']

  - category_id: ct_ped
    parent_category_id: ct
    priority: 1
    # 나이 우선 원칙: xray_ped / ct_ped / mri_ped / ultrasound_ped / fluoroscopy_ped 동일
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: not_null
                field: age
              - operator: lessThan
                field: age
                value: 17
          - logic: AND
            conditions:
              - operator: is_null
                field: age
              - operator: contains_any
                field: assign
                value: ['Pediatrics', 'PED']
  - category_id: ct_ped_neu
    parent_category_id: ct_ped
    inherit_conditions_from: ct_neu
  - category_id: ct_ped_cht
    parent_category_id: ct_ped
    inherit_conditions_from: ct_cht
  - category_id: ct_ped_abd
    parent_category_id: ct_ped
    inherit_conditions_from: ct_abd
  - category_id: ct_ped_gu
    parent_category_id: ct_ped
    priority: 2
    inherit_conditions_from: ct_gu
  - category_id: ct_ped_msk
    parent_category_id: ct_ped
    inherit_conditions_from: ct_msk
  - category_id: ct_ped_spine
    parent_category_id: ct_ped
    inherit_conditions_from: ct_spine
  - category_id: ct_ped_vas
    parent_category_id: ct_ped
    inherit_conditions_from: ct_vas
  - category_id: ct_ped_cardiac
    parent_category_id: ct_ped
    inherit_conditions_from: ct_cardiac

  - category_id: mri
    conditions:
      - operator: contains
        field: modality
        value: 'MR'
  - category_id: mri_neu
    parent_category_id: mri
    conditions:
      - logic: OR
        conditions:
          - operator: contains_any
            field: assign
            value: ['Neuro', 'NEU', 'H&N']
          - operator: contains_any
            field: exam_name
            value:
              [
                'brain',
                'stroke',
                'cranial',
                'neck',
                'orbit',
                'sella',
                'head',
                'pns',
                'moyamoya',
                'nasopharyn',
                'MR,Diffusion'
              ]
      - operator: not_contains
        field: exam_name
        value: 'SPINE'
      - operator: not_contains_any
        field: assign
        value: ['ABD', 'Abdomen', 'MAM', 'Breast', 'CHT', 'Chest', 'MSK', 'Musculoskeletal']
      - operator: not_contains_any
        field: exam_name
        value:
          [
            'breast',
            'chest',
            'liver',
            'biliary',
            'pancreas',
            'rectum',
            'enterography',
            'abdomen',
            'pelvis',
            'kidney',
            'scrotum',
            'prostate',
            'bladder',
            'musculo',
            'extremity'
          ]
  - category_id: mri_cht
    parent_category_id: mri
    # 흉부 MRI. mri_neu(10)·mri_abd(10)보다 먼저, mri_msk(3)보다는 함께 빠르게
    # 평가되어야 흉부 판독실 + chest 행이 근골격으로 새지 않는다.
    priority: 2
    conditions:
      - logic: OR
        conditions:
          - operator: contains_any
            field: assign
            value: ['chest lung', 'CHT']
          - operator: contains_any
            field: exam_name
            value:
              [
                'chest',
                'thorax',
                'pulmonary embolism',
                'bronchial',
                'tracheobronchial',
                'pulmonary hypertension'
              ]
      - operator: not_contains
        field: exam_name
        value: 'SPINE'
      - operator: not_contains_any
        field: exam_name
        value: ['breast', 'aortic', 'aorta', 'angiography', 'pulmonary vein']
      # 유방 판독실이 읽은 'MR,Thorax' 는 흉부가 아니라 유방 MRI다
      - operator: not_contains_any
        field: assign
        value: ['Breast', 'MAM']
  - category_id: mri_vas
    parent_category_id: mri
    # 혈관 MRI. 두경부 MRA/MRV·경동맥은 신경두경부 판독이므로 제외한다.
    # 담도조영(cholangiography)은 복부 MRI다.
    # 판독실(chest cv/VAS)은 심장 MRI와 공유라 조건으로 쓰지 않고 검사명만 본다.
    priority: 2
    conditions:
      - operator: contains_any
        field: exam_name
        value:
          [
            'aortic',
            'aorta',
            'angiography',
            'angiographic',
            'pulmonary vein',
            'venography',
            'arteriography',
            'MRV'
          ]
      - operator: not_contains_any
        field: exam_name
        value:
          [
            'head',
            'brain',
            'cranial',
            'neck',
            'carotid',
            'facial',
            'cholangiography',
            'biliary',
            'pancreas',
            'liver',
            'abdomen',
            'dsa',
            'digital subtraction',
            'heart',
            'cardiac',
            'Cardio',
            'valve',
            'perfusion'
          ]
      - operator: not_contains
        field: exam_name
        value: 'SPINE'
  - category_id: mri_cardiac
    parent_category_id: mri
    conditions:
      - logic: OR
        conditions:
          - operator: contains_any
            field: assign
            value: ['Cardio', 'CARDIAC']
          - operator: contains_any
            field: exam_name
            value: ['Cardio', 'cardiac', 'heart']
  - category_id: mri_abd
    parent_category_id: mri
    conditions:
      - operator: not_contains_any
        field: exam_name
        value:
          ['pelvis', 'kidney', 'scrotum', 'prostate', 'bladder', '전립선', '신장', '방광', '생식기']
      - logic: OR
        conditions:
          - operator: contains_any
            field: assign
            value: ['Abdomen', 'ABD']
          - operator: contains_any
            field: exam_name
            value:
              [
                'liver',
                'biliary',
                'pancreas',
                'cholangiography',
                'enterography',
                'abdomen',
                'anal fistula'
              ]
  - category_id: mri_gu
    parent_category_id: mri
    priority: 2
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: contains
                field: exam_name
                value: 'pelvis'
              - operator: not_contains
                field: exam_name
                value: 'bone'
          - logic: AND
            conditions:
              - operator: not_contains_any
                field: exam_name
                value: ['abdomen', 'Spine', 'spine', 'SPINE']
              - logic: OR
                conditions:
                  - operator: equals_any
                    field: assign
                    value:
                      ['Genitourinary', 'URO', 'GU', 'UROLOGY', 'OBGY', '비뇨의학과', '산부인과']
                  - operator: contains_any
                    field: exam_name
                    value:
                      [
                        'urography',
                        'urinary',
                        'adrenal',
                        'bladder',
                        'kidney',
                        'scrotum',
                        'prostate',
                        '전립선',
                        '신장',
                        '방광',
                        '생식기',
                        'Uterine',
                        'uterine',
                        'Endometrial',
                        'endometrial',
                        'Ovary',
                        'ovary',
                        'Cervix',
                        'cervix',
                        'Female pelvis',
                        'Male pelvis'
                      ]
  - category_id: mri_spine
    parent_category_id: mri
    priority: 2
    conditions:
      - operator: contains_any
        field: exam_name
        value: ['SPINE', 'Spine', 'spine', 'C-spine', 'L-spine', 'T-spine']
  - category_id: mri_msk
    parent_category_id: mri
    priority: 3
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: contains_any
                field: assign
                value: ['Musculoskeletal', 'MSK']
              - operator: not_contains_any
                field: exam_name
                value: ['SPINE', 'Spine', 'spine']
          - logic: AND
            conditions:
              - operator: contains_any
                field: exam_name
                value: ['extremity', 'trauma', 'upper arm', 'lower arm', 'knee', 'elbow']
              # 골반절 MRI는 비뇨생식기로 집계한다 (A/B 수동검토 판정 기준)
              - operator: not_contains
                field: exam_name
                value: 'pelvis'
  - category_id: mri_breast
    parent_category_id: mri
    priority: 2
    conditions:
      - logic: OR
        conditions:
          - operator: contains_any
            field: assign
            value: ['Breast', 'MAM']
          - operator: contains_any
            field: exam_name
            value: ['breast', '유방']
  - category_id: mri_ped
    parent_category_id: mri
    priority: 1
    # 나이 우선 원칙: xray_ped / ct_ped / mri_ped / ultrasound_ped / fluoroscopy_ped 동일
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: not_null
                field: age
              - operator: lessThan
                field: age
                value: 17
          - logic: AND
            conditions:
              - operator: is_null
                field: age
              - operator: contains_any
                field: assign
                value: ['Pediatrics', 'PED']
  - category_id: mri_ped_neu
    parent_category_id: mri_ped
    inherit_conditions_from: mri_neu
  - category_id: mri_ped_abd
    parent_category_id: mri_ped
    inherit_conditions_from: mri_abd
  - category_id: mri_ped_spine
    parent_category_id: mri_ped
    inherit_conditions_from: mri_spine
  - category_id: mri_ped_msk
    parent_category_id: mri_ped
    inherit_conditions_from: mri_msk
  - category_id: mri_ped_cardiac
    parent_category_id: mri_ped
    inherit_conditions_from: mri_cardiac
  - category_id: mri_ped_gu
    parent_category_id: mri_ped
    inherit_conditions_from: mri_gu
  - category_id: mri_ped_cht
    parent_category_id: mri_ped
    priority: 2
    inherit_conditions_from: mri_cht
  - category_id: mri_ped_vas
    parent_category_id: mri_ped
    priority: 2
    inherit_conditions_from: mri_vas
  - category_id: mri_ped_breast
    parent_category_id: mri_ped
    priority: 2
    inherit_conditions_from: mri_breast

  - category_id: ultrasound
    priority: 1
    conditions:
      - operator: not_contains_any
        field: exam_name
        value: ['biopsy', '생검', '조직검사']
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: equals_any
                field: modality
                value: ['US', 'US/SR']
              - operator: not_contains_any
                field: exam_name
                value: ['유도', '고주파', 'intussusception', 'aspiration', 'Drainage', '배액']
          - operator: contains_any
            field: exam_name
            value: ['Simple US', 'Guiding US']
  - category_id: ultrasound_ped
    parent_category_id: ultrasound
    priority: 0
    # 나이 우선 원칙: xray_ped / ct_ped / mri_ped / ultrasound_ped / fluoroscopy_ped 동일
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: not_null
                field: age
              - operator: lessThan
                field: age
                value: 17
          - logic: AND
            conditions:
              - operator: is_null
                field: age
              - operator: contains_any
                field: assign
                value: ['Pediatrics', 'PED']
  - category_id: ultrasound_ped_head
    parent_category_id: ultrasound_ped
    inherit_conditions_from: ultrasound_head
  - category_id: ultrasound_ped_abd
    parent_category_id: ultrasound_ped
    inherit_conditions_from: ultrasound_abd
  - category_id: ultrasound_ped_gu
    parent_category_id: ultrasound_ped
    inherit_conditions_from: ultrasound_gu
  - category_id: ultrasound_ped_msk
    parent_category_id: ultrasound_ped
    inherit_conditions_from: ultrasound_msk
  # 성인 갑상선/유방/도플러 규칙은 priority 0이라 소아 분할(priority 0, 선언 순서 뒤)보다
  # 먼저 평가된다. 그래서 소아 하위에도 같은 조건의 규칙을 두고, 성인 규칙에서 소아
  # 판독실/미만 나이를 제외해 두어야 소아 행이 성인 카테고리로 새지 않는다.
  - category_id: ultrasound_ped_thyroid
    parent_category_id: ultrasound_ped
    priority: 0
    conditions:
      - operator: contains_any
        field: exam_name
        value: ['thyroid', 'parathyroid', '갑상선', '부갑상선']
      - operator: not_contains_any
        field: exam_name
        value: ['aspiration', 'biopsy', '생검', '흡인', '갑상선·부갑상선 제외']
  - category_id: ultrasound_ped_breast
    parent_category_id: ultrasound_ped
    priority: 0
    conditions:
      - logic: OR
        conditions:
          - operator: contains_any
            field: assign
            value: ['Breast', 'MAM']
          - operator: contains_any
            field: exam_name
            value: ['breast', 'axilla', '유방']
      - operator: not_contains_any
        field: exam_name
        value: ['유방·액와부 제외']
  - category_id: ultrasound_ped_doppler
    parent_category_id: ultrasound_ped
    # 도플러는 검사기법이라 부위와 독립이다. 소아에서도 성인과 같은 우선순위로 본다.
    priority: 0
    conditions:
      - operator: contains_any
        field: exam_name
        value: ['doppler', '도플러', 'carotid', '혈관']
      - operator: not_contains_any
        field: exam_name
        value:
          [
            'thyroid',
            'parathyroid',
            '갑상선',
            '부갑상선',
            'kidney',
            '신장',
            'scrot',
            'transplanted organ',
            'salivary',
            '침샘'
          ]

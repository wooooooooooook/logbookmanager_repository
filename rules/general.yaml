    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: contains_any
                field: assign
                value: ['Abdomen', 'ABD']
              - operator: not_contains_any
                field: exam_name
                value: ['penis', 'scrot', '생식기', 'carotid doppler', 'color doppler']
          # "Abdomen US - Penis" 처럼 검사명에 복부와 비뇨 부위가 함께 적힌 경우.
          # (병원 확인: 비뇨로 집계) 비뇨 키워드가 있으면 복부로 보내지 않는다.
          - logic: AND
            conditions:
              - operator: contains_any
                field: exam_name
                value:
                  ['appendix', 'colon', 'abdomen', 'hepatic', 'mesenteric', 'bowel', 'inguinal']
              - operator: not_contains_any
                field: exam_name
                value: ['penis', 'scrotum', '생식기']
      # "abdomen US(신장,부신,방광)" 처럼 복강 초음파라도 비뇨생식기 부위가 명시되면 복부가 아니다

  - category_id: intervention
    priority: 1
    composed_by_subcategories: true
  - category_id: intervention_neu
    parent_category_id: intervention
    conditions:
      - operator: contains_any
        field: exam_name
        value: ['뇌혈관조영술', 'Vessel Angiography', 'Internal Carotid Angiography', '신경중재']
      # 검사명에 CT가 명시된 경우("CT,Head angiography")는 CT 혈관조영이다
      - operator: regex
        field: exam_name
        value: '^(?:(?!.*\bct\b)[\s\S])*$'
        regex_flags: 'i'
  - category_id: intervention_thyroid
    parent_category_id: intervention
    priority: 5
    conditions:
      - operator: contains_any
        field: exam_name
        value: ['갑상선', 'thyroid']
      - operator: contains_any
        field: exam_name
        value: ['biopsy', 'aspiration']
  - category_id: intervention_us
    parent_category_id: intervention
    priority: 6
    conditions:
      - operator: equals
        field: modality
        value: 'US'
      - operator: contains_any
        field: exam_name
        value: ['생검', '조직검사', 'biopsy', 'aspiration', '흡인']
  - category_id: intervention_ct
    parent_category_id: intervention
    conditions:
      - operator: equals
        field: modality
        value: 'CT'
      - operator: contains_any
        field: exam_name
        value: ['생검', '조직검사', 'biopsy']
  - category_id: intervention_intu
    parent_category_id: intervention
    conditions:
      - operator: contains
        field: exam_name
        value: 'intussusception'
  - category_id: intervention_cfa
    parent_category_id: intervention
    conditions:
      - operator: contains
        field: exam_name
        value: '대퇴동맥천자술'
  - category_id: intervention_angio
    parent_category_id: intervention
    conditions:
      - operator: equals
        field: modality
        value: 'DS'
      - operator: contains_any
        field: exam_name
        value:
          [
            'embolization',
            'arteriography',
            'angioplasty',
            'Angiography',
            'aortography',
            'TACE',
            'TACI',
            'UAE',
            'BAE',
            '혈관조영'
          ]
      # 검사명에 CT가 명시된 경우("Angiographic CT")는 시술이 아닌 CT 혈관조영이다
      - operator: regex
        field: exam_name
        value: '^(?:(?!.*\bct\b)[\s\S])*$'
        regex_flags: 'i'
  - category_id: intervention_biliary
    parent_category_id: intervention
    priority: 5
    conditions:
      - operator: equals
        field: modality
        value: 'DS'
      - operator: contains_any
        field: exam_name
        value:
          [
            'transhepatic',
            'cholecystostomy',
            'biliary',
            'PTBD',
            'Cholecystostomy',
            'Cholangiography'
          ]
      - operator: not_contains
        field: exam_name
        value: 'portography'
  - category_id: intervention_pcn
    parent_category_id: intervention
    conditions:
      - operator: equals
        field: modality
        value: 'DS'
      - operator: contains_any
        field: exam_name
        value: ['PCN', 'Nephrostomy']
  - category_id: intervention_drain
    parent_category_id: intervention
    priority: 5
    conditions:
      - operator: contains_any
        field: exam_name
        value:
          [
            'drainage',
            'Chest tube',
            'Chest aspiration',
            'Cystostomy',
            'tube change',
            '천자',
            '배액'
          ]
      - operator: not_contains_any
        field: exam_name
        value: ['Nephrostomy', '신우']
  - category_id: intervention_cvc
    parent_category_id: intervention
    # PICC/중심정맥 카테터는 검사명에 "혈관조영"이 함께 붙어 있어
    # intervention_angio 보다 먼저 평가해야 한다
    priority: 2
    conditions:
      - operator: equals
        field: modality
        value: 'DS'
      - operator: contains_any
        field: exam_name
        value:
          [
            'catheter insertion',
            'PICC',
            'chemoport',
            'central line',
            'Central Vein Catheter',
            'Catheterization',
            'Hemodialysis',
            'Hickman',
            'Permcath',
            'Chemo Port'
          ]
  - category_id: intervention_tumor
    parent_category_id: intervention
    conditions:
      - operator: contains_any
        field: exam_name
        value:
          [
            '고주파',
            '마이크로웨이브',
            'HIFU',
            'TACE',
            '경화',
            '경화술',
            'Sclerotherapy',
            'sclerotherapy',
            'RFA'
          ]
      - operator: not_contains_any
        field: exam_name
        value: ['혈관기형', 'malformation', 'Malformation', 'AVM']
  - category_id: intervention_etc
    parent_category_id: intervention
    priority: 999
    conditions:
      - operator: contains
        field: modality
        value: 'DS'
      # 검사명에 CT가 명시된 경우("Angiographic CT")는 시술이 아닌 CT 혈관조영이다
      - operator: regex
        field: exam_name
        value: '^(?:(?!.*\bct\b)[\s\S])*$'
        regex_flags: 'i'
      - operator: not_contains_any
        field: exam_name
        value: ['Simple US', 'Guiding US']
  - category_id: nuclearmedicine
    composed_by_subcategories: true
  - category_id: nuclearmedicine_pet
    parent_category_id: nuclearmedicine
    conditions:
      - operator: equals
        field: modality
        value: 'NM'
      - operator: contains
        field: exam_name
        value: 'PET'
        case_sensitive: true
  - category_id: nuclearmedicine_other
    parent_category_id: nuclearmedicine
    conditions:
      - operator: equals
        field: modality
        value: 'NM'
drop_rules:
  - name: '골밀도 검사 제외'
    description: '검사종류(modality)가 BD, BMD, BDUS인 골밀도 검사는 판독목록에서 제외'
    field: modality
    operator: equals_any
    value: ['BD', 'BMD', 'BDUS']

  - name: '내시경 검사 제외'
    description: '검사종류(modality)가 ES인 내시경 검사는 판독목록에서 제외'
    field: modality
    operator: equals
    value: 'ES'

  - name: '안과 검사 제외'
    description: '검사종류(modality)가 FP, OCT, OP, OPT인 안과 검사는 판독목록에서 제외'
    field: modality
    operator: equals_any
    value: ['FP', 'OCT', 'OP', 'OPT']

  - name: '치과 검사 제외'
    description: '검사종류(modality)가 IO, PX인 치과 검사는 판독목록에서 제외'
    field: modality
    operator: equals_any
    value: ['IO', 'PX']

# CSV/Excel 내보내기 설정
export_as_sheet:
  default_format: 'csv' # 기본 내보내기 형식
  encoding: 'utf-8' # 파일 인코딩
  filename:
    pattern: 'logbook_export_{date}_{time}'
    date_format: 'YYYY-MM-DD'
    time_format: 'HH-mm-ss'
  templates:
    - name: 'for_record2'
      export_site: record2
      description: 'record2 사이트 업로드용 (예시 엑셀 파일과 동일한 구조)'
      column_order:
        - 'serial_number'
        - 'modality'
        - 'specialty'
        - 'sex'
        - 'study_date'
        - 'reading_date'
        - 'exam_name'

      columns:
        # 일련번호 (자동 생성)
        - serial_number:
            name: '일련번호'
            type: 'number'
            width: 8
            value:
              auto_increment:
                start_value: 1
                increment: 1

        # 검사종류 (메타데이터에서 가져오기)
        - modality:
            name: '검사종류'
            type: 'string'
            width: 12
            value:
              from_metadata:
                key: examination_type_name
            is_classifier: true
            map_to_export_target: true

        # 세부전공 (조건부 로직으로 가져오기)
        - specialty:
            name: '세부전공'
            type: 'string'
            width: 12
            value:
              from_metadata:
                key: 'specialty_name'
            is_classifier: true
            map_to_export_target: true

        # 환자성별 (데이터 필드에서 가져오기)
        - sex:
            name: '환자성별(M/F)'
            type: 'string'
            width: 8
            value:
              fallback_chain:
                - from_field:
                    field: 'sex'
                - static:
                    value: '성별정보 없음'

        # 검사일 (데이터 필드에서 가져오기)
        - study_date:
            name: '검사일(년-월-일)'
            type: 'date'
            width: 12
            date_format: 'YYYY-MM-DD'
            value:
              fallback_chain:
                - from_field:
                    field: 'study_date'
                - static:
                    value: '검사일 없음'

        # 판독일 (데이터 필드에서 가져오기)
        - reading_date:
            name: '판독일(년-월-일)'
            type: 'date'
            width: 12
            date_format: 'YYYY-MM-DD'
            value:
              from_field:
                field: 'reading_date'

        # 검사명 (fallback chain으로 가져오기)
        - exam_name:
            name: '검사명'
            type: 'string'
            width: 20
            value:
              fallback_chain:
                - from_field:
                    field: 'exam_name'
                - static:
                    value: '검사명 없음'
      ajax_template: |
        $.ajax({
          url: "/major/reading/handle/reading_A_upsert.php",
          type: "POST",
          data: {
            sid: "",
            gubun: {{modality}},
            kind: {{specialty}},
            reading_count: {{count}},
            sdate: "{{start_date}}",
            edate: "{{end_date}}"
          },
          dataType: "text",
          success: function(e) {
            console.log("{{modality}} | {{specialty}} 업로드 완료");
          }
        });

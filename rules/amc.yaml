# 분류 기준 정의
classification_rules:
  # 데이터 검증 규칙 (최우선 적용)
  - category_id: xray
    conditions:
      - operator: equals
        field: modality
        value: 'CR'
  - category_id: xray_neu
    parent_category_id: xray
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: equals
                field: assign
                value: 'Neuro'
              - operator: not_contains_any
                field: exam_name
                value:
                  [
                    'Chest',
                    'Abdomen',
                    'Spine',
                    'ankle',
                    'shoulder',
                    'clavicle',
                    'humerus',
                    'joint',
                    'elbow',
                    'femur',
                    'foot',
                    'forearm',
                    'wrist',
                    'hand',
                    'finger',
                    'hip',
                    'knee',
                    'leg',
                    'pelvis',
                    'rib',
                    'coccyx',
                    'extremity',
                    'toe'
                  ]
          - operator: contains_any
            field: exam_name
            value:
              [
                'skull',
                'neck',
                'pns',
                'mastoid',
                'mandible',
                'zygoma',
                'zygomatic',
                'nasal',
                'sella',
                't-m joint'
              ]
  - category_id: xray_cht
    parent_category_id: xray
    conditions:
      - operator: contains
        field: exam_name
        value: 'Chest'
  - category_id: xray_abd
    parent_category_id: xray
    conditions:
      - operator: contains_any
        field: exam_name
        value: ['Abdomen', 'CTTS']
  - category_id: xray_kub
    parent_category_id: xray
    priority: 2
    conditions:
      - operator: contains
        field: exam_name
        value: 'KUB'
        case_sensitive: true
  - category_id: xray_spine
    parent_category_id: xray
    priority: 2
    conditions:
      - operator: contains_any
        field: exam_name
        value: ['Spine', 'C-spine', 'T-spine', 'L-spine', 'atlas']
  - category_id: xray_msk
    parent_category_id: xray
    conditions:
      # Infantogram(신생아 전신)은 근골격으로 잡지 않고 기타로 보낸다
      - operator: not_contains
        field: exam_name
        value: 'infantogram'
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: equals
                field: assign
                value: 'Musculoskeletal'
              - operator: not_contains_any
                field: exam_name
                value: ['Chest', 'Abdomen', 'Spine']
          - logic: AND
            conditions:
              - operator: equals
                field: assign
                value: 'Emergency'
              - operator: not_contains_any
                field: exam_name
                value: ['skull', 'neck', 'chest', 'abdomen', 'spine', 'pns']
          - operator: contains_any
            field: exam_name
            value:
              [
                'ankle',
                'shoulder',
                'clavicle',
                'humerus',
                'joint',
                'elbow',
                'femur',
                'foot',
                'forearm',
                'wrist',
                'hand',
                'finger',
                'hip',
                'knee',
                'leg',
                'pelvis',
                'rib',
                'coccyx',
                'extremity',
                'whole skeletal',
                'teleradiogram',
                'toe',
                'Sacrum',
                'whole body'
              ]
  - category_id: xray_ped
    parent_category_id: xray
    priority: 1
    # 나이가 있으면 나이를 기준으로 한다. 판독실(PED)만으로 소아로 보내면
    # 성인 환자를 소아로 집계하게 되므로, 나이 결측일 때만 판독실을 참조한다.
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: not_null
                field: age
              - operator: lessThan
                field: age
                value: 17
          - logic: AND
            conditions:
              - operator: is_null
                field: age
              - operator: contains_any
                field: assign
                value: ['Pediatrics', 'PED']
  - category_id: xray_ped_neu
    parent_category_id: xray_ped
    inherit_conditions_from: xray_neu
  - category_id: xray_ped_abd
    parent_category_id: xray_ped
    inherit_conditions_from: xray_abd
  - category_id: xray_ped_msk
    parent_category_id: xray_ped
    inherit_conditions_from: xray_msk
  - category_id: xray_ped_spine
    parent_category_id: xray_ped
    inherit_conditions_from: xray_spine
  - category_id: xray_ped_cht
    parent_category_id: xray_ped
    inherit_conditions_from: xray_cht
  - category_id: xray_ped_kub
    parent_category_id: xray_ped
    # inherit_conditions_from 은 조건만 상속하므로 priority는 직접 지정해야 한다
    priority: 2
    inherit_conditions_from: xray_kub

  - category_id: mammography
    priority: 2
    composed_by_subcategories: true
  - category_id: mammography_mammography
    parent_category_id: mammography
    conditions:
      - operator: equals
        field: modality
        value: 'MG'
  - category_id: ct
    conditions:
      - logic: OR
        conditions:
          - operator: equals
            field: modality
            value: 'CT'
          # PACS 검사종류가 범용 코드(DS 등)라도 검사명에 CT가 명시되어 있으면 CT로 본다
          - operator: regex
            field: exam_name
            value: '\bct\b'
            regex_flags: 'i'
      # PET-CT 는 CT 항목이 아니라 핵의학과(PET) 항목이다.
      # (병원 확인: "(FDG) Torso PET-CT" -> "nm_pet으로")
      - operator: not_contains
        field: exam_name
        value: 'PET'
  - category_id: ct_neu
    parent_category_id: ct
    conditions:
      - logic: OR
        conditions:
          - operator: equals
            field: assign
            value: 'neuro'
          - operator: contains_any
            field: exam_name
            value:
              [
                'brain',
                'facial',
                'nasal',
                'head',
                'neck',
                'orbit',
                'OMU',
                'PNS',
                'temporal bone',
                'pharynx',
                'salivary'
              ]
      - operator: not_contains_any
        field: exam_name
        value: ['bronchial', 'tracheobronchial']
  - category_id: ct_cht
    parent_category_id: ct
    conditions:
      - logic: OR
        conditions:
          - operator: equals
            field: assign
            value: 'chest lung'
          - operator: contains_any
            field: exam_name
            value:
              [
                'chest',
                'pulmonary embolism',
                'bronchial',
                'tracheobronchial',
                'pulmonary hypertension'
              ]
  - category_id: ct_cardiac
    parent_category_id: ct
    priority: 6
    conditions:
      - logic: OR
        conditions:
          - operator: equals
            field: assign
            value: 'chest CV'
          - operator: contains_any
            field: exam_name
            value: ['cardiac', 'heart', 'coronary artery']
      - operator: not_contains_any
        field: exam_name
        value: ['aortic', 'aorta', 'angiography', 'pulmonary vein', 'pulmonary hypertension']
  - category_id: ct_vas
    parent_category_id: ct
    priority: 4
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: contains_any
                field: exam_name
                value:
                  [
                    'aortic',
                    'aorta',
                    'angiography',
                    'angiographic',
                    'pulmonary vein',
                    'venography',
                    'arteriography'
                  ]
              # 두부 혈관조영은 신경두경부 CT로 집계한다
              - operator: not_contains_any
                field: exam_name
                value: ['head', 'brain', 'cranial', 'neck', 'carotid', 'facial']
          - operator: contains
            field: exam_name
            value: 'Neck angiography & Perfusion'
  - category_id: ct_abd
    parent_category_id: ct
    conditions:
      - logic: OR
        conditions:
          - operator: equals
            field: assign
            value: 'Abdomen'
          - operator: contains_any
            field: exam_name
            value: ['abdomen', 'liver', 'biliary', 'pancreas', 'enterography']
  - category_id: ct_gu
    parent_category_id: ct
    priority: 2
    conditions:
      - operator: not_contains
        field: exam_name
        value: 'Liver dynamic'
      - logic: OR
        conditions:
          - operator: equals_any
            field: assign
            value: ['Genitourinary', 'OBGY']
          - operator: contains_any
            field: exam_name
            value:
              [
                'urography',
                'urinary',
                'adrenal',
                'bladder',
                '요로',
                '결석',
                '신장',
                '방광',
                '전립선',
                '신우'
              ]
          - logic: AND
            conditions:
              - operator: equals
                field: exam_name
                value: '(외부자료-판독) CT,Pelvis'
              - operator: equals
                field: assign
                value: 'Emergency'
  - category_id: ct_spine
    parent_category_id: ct
    priority: 2
    conditions:
      - operator: contains
        field: exam_name
        value: 'SPINE'
  - category_id: ct_msk
    parent_category_id: ct
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: equals
                field: assign
                value: 'Musculoskeletal'
              - operator: not_contains
                field: exam_name
                value: 'SPINE'
          - operator: contains_any
            field: exam_name
            value: ['extremity', 'pelvis', 'trauma']

  - category_id: ct_ped
    parent_category_id: ct
    priority: 1
    # 나이 우선 원칙: xray_ped / ct_ped / mri_ped / ultrasound_ped / fluoroscopy_ped 동일
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: not_null
                field: age
              - operator: lessThan
                field: age
                value: 17
          - logic: AND
            conditions:
              - operator: is_null
                field: age
              - operator: contains_any
                field: assign
                value: ['Pediatrics', 'PED']
  - category_id: ct_ped_neu
    parent_category_id: ct_ped
    inherit_conditions_from: ct_neu
  - category_id: ct_ped_cht
    parent_category_id: ct_ped

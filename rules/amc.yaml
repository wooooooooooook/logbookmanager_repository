  - category_id: mri_ped_msk
    parent_category_id: mri_ped
    inherit_conditions_from: mri_msk
  - category_id: mri_ped_cardiac
    parent_category_id: mri_ped
    inherit_conditions_from: mri_cardiac
  - category_id: mri_ped_gu
    parent_category_id: mri_ped

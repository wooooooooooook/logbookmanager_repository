  - category_id: mri_gu
    parent_category_id: mri
    # bone이 없는 Pelvis MR(Female/Male pelvis, 외부자료 등)은 판독실과 무관하게 GU로 판단하도록 복부/근골격보다 우선 평가
    priority: 2
    conditions:
      - logic: OR
        conditions:
          # Pelvis 검사인데 bone이 없으면 GU로 판단 (Female pelvis, Male pelvis, 외부자료 MR,Pelvis 등)
          - logic: AND
            conditions:
              - operator: contains
                field: exam_name
                value: 'pelvis'
              - operator: not_contains
                field: exam_name
                value: 'bone'
          - logic: AND
            conditions:
              - operator: not_contains
                field: exam_name
                value: 'abdomen'
              - logic: OR
                conditions:
                  - operator: equals
                    field: assign
                    value: 'Genitourinary'
                  - operator: contains_any
                    field: exam_name
                    value:
                      [
                        'urography',
                        'urinary',
                        'adrenal',
                        'bladder',
                        'kidney',
                        'scrotum',
                        'prostate',
                        '전립선',
                        '신장',
                        '방광',
                        '생식기'
                      ]
  - category_id: mri_spine
    parent_category_id: mri

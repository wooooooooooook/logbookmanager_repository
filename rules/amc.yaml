        value: 'MR'
  - category_id: mri_neu
    parent_category_id: mri
    conditions:
      - logic: OR
        conditions:
          - operator: equals
            field: assign
            value: 'Neuro'
          - operator: contains_any
            field: exam_name
            value:
              [
                'brain',
                'diffusion',
                'stroke',
                'cranial',
                'neck',
                'orbit',
                'sella',
                'head',
                'pns',
                'moyamoya',
                'nasopharyn',
                'face',
                'temporal bone',
                'trauma'
              ]
      - operator: not_contains
        field: exam_name
        value: 'SPINE'
  - category_id: mri_cht
    parent_category_id: mri
    # 흉부 MRI. mri_neu(10)·mri_abd(3)보다 먼저 평가되어야 하고,
    # mri_msk(3)보다도 빨라야 'Chest Lung 판독실 + Thorax' 행이 근골격으로 새지 않는다.
    priority: 2
    conditions:
      - logic: OR
        conditions:
          - operator: equals
            field: assign
            value: 'Chest Lung'
          - operator: contains_any
            field: exam_name
            value:
              [
                'chest',
                'thorax',
                'pulmonary embolism',
                'bronchial',
                'tracheobronchial',
                'pulmonary hypertension'
              ]
      - operator: not_contains
        field: exam_name
        value: 'SPINE'
      - operator: not_contains_any
        field: exam_name
        value: ['breast', 'aortic', 'aorta', 'angiography', 'pulmonary vein']
      # 유방 판독실이 읽은 'MR,Thorax' 는 흉부가 아니라 유방 MRI다
      - operator: not_contains_any
        field: assign
        value: ['Breast', 'MAM']
  - category_id: mri_vas
    parent_category_id: mri
    # 혈관 MRI. 두경부 MRA/MRV·경동맥은 신경두경부 판독이므로 제외한다.
    # 담도조영(cholangiography)은 복부 MRI다.
    # 판독실(chest cv)은 심장 MRI와 공유라 조건으로 쓰지 않고 검사명만 본다.
    priority: 2
    conditions:
      - operator: contains_any
        field: exam_name
        value:
          [
            'aortic',
            'aorta',
            'angiography',
            'angiographic',
            'pulmonary vein',
            'venography',
            'arteriography',
            'MRV'
          ]
      - operator: not_contains_any
        field: exam_name
        value:
          [
            'head',
            'brain',
            'cranial',
            'neck',
            'carotid',
            'facial',
            'cholangiography',
            'biliary',
            'pancreas',
            'liver',
            'abdomen',
            'dsa',
            'digital subtraction',
            'heart',
            'cardiac',
            'Cardio',
            'valve',
            'perfusion'

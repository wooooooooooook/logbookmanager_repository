                value:
                  [
                    'extremity',
                    'trauma',
                    'foot',
                    'ankle',
                    'knee',
                    'hip',
                    'shoulder',
                    'elbow',
                    'wrist',
                    'hand',
                    'bone',
                    'musculo',
                    'skeletal',
                    'meniscus',
                    'upper arm',
                    'lower arm',
                    'sacrum'
                  ]
              - operator: not_contains_any
                field: exam_name
                value: ['temporal bone', 'brain', 'Diffusion']
  - category_id: mri_breast
    parent_category_id: mri
    conditions:
      - operator: equals

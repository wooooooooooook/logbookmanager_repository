  - category_id: ultrasound
    priority: 0
    conditions:
      - operator: not_contains_any
        field: exam_name
        value: ['biopsy', '생검', '조직검사']
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: equals
                field: modality
                value: 'US'
              - operator: not_contains_any
                field: exam_name
                value: ['유도', '고주파', 'intussusception', 'aspiration']
          - operator: contains_any
            field: exam_name
            value: ['Simple US', 'Guiding US']
  - category_id: ultrasound_head
    parent_category_id: ultrasound
    conditions:
      - operator: not_contains
        field: exam_name
        value: 'Neck with doppler'
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: equals
                field: assign
                value: 'Neuro'
              - operator: not_contains_any
                field: exam_name
                value: ['abdomen doppler', 'carotid doppler', 'color doppler']
          - operator: contains_any
            field: exam_name
            value: ['brain', 'neck', 'orbit', 'sella', 'head', 'salivary']
  - category_id: ultrasound_thyroid
    parent_category_id: ultrasound
    priority: 0
    conditions:
      - operator: not_equals
        field: assign
        value: 'Pediatrics'
      - logic: OR
        conditions:
          - operator: greaterThan
            field: age
            value: 16
          - operator: is_null
            field: age
      - operator: contains_any
        field: exam_name
        value: ['thyroid', 'parathyroid', '갑상선', '부갑상선']
      - operator: not_contains_any
        field: exam_name
        value: ['aspiration', 'biopsy', '생검', '흡인']
  - category_id: ultrasound_abd
    parent_category_id: ultrasound
    conditions:
      - operator: not_contains
        field: exam_name
        value: 'Guiding US'
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: equals
                field: assign
                value: 'Abdomen'
              - operator: not_contains_any
                field: exam_name
                value: ['abdomen doppler', 'color doppler']
          - operator: contains_any
            field: exam_name
            value: ['appendix', 'colon', 'abdomen', 'hepatic', 'mesenteric', 'bowel', 'inguinal']
      # "abdomen US(신장,부신,방광)" 처럼 복강 초음파라도 비뇨생식기 부위가 명시되면 복부가 아니다
      - operator: not_contains_any
        field: exam_name
        value:
          [
            '신장',
            '부신',
            '방광',
            '전립선',
            '자궁',
            '난소',
            '여성생식기',
            '남성생식기',
            'kidney',
            'adrenal',
            'bladder',
            'uterus',
            'ovary',
            'prostate'
          ]
  - category_id: ultrasound_gu
    parent_category_id: ultrasound
    conditions:
      - logic: OR
        conditions:
          - operator: equals_any
            field: assign
            value: ['Genitourinary', 'OBGY']
          - operator: contains_any
            field: exam_name
            value:
              [
                'penis',
                'scrot',
                '생식기',
                '신장',
                '부신',
                '방광',
                '전립선',
                '자궁',
                '난소',
                'kidney',
                'adrenal',
                'bladder',
                'uterus',
                'ovary',
                'genital',
                'prostate',
                'transplanted organ',
                'endovaginal'
              ]
          - logic: AND
            conditions:
              - operator: contains_any
                field: exam_name
                value: ['scrot', 'kidney', 'transplanted organ']
              - operator: not_equals
                field: assign
                value: 'Pediatrics'
          - operator: contains
            field: exam_name
            value: 'endovaginal'
  - category_id: ultrasound_msk
    parent_category_id: ultrasound
    conditions:
      - logic: OR
        conditions:
          - operator: equals
            field: assign
            value: 'Musculoskeletal'
          - operator: contains_any
            field: exam_name
            value:
              [
                'spine',
                'soft tissue',
                'extremity',
                'pelvis',
                'trauma',
                'foot',
                'ankle',
                'knee',
                'hip',
                'shoulder',
                'elbow',
                'wrist',
                'hand',
                'bone',
                'musculo',
                'skeletal',
                'meniscus'
              ]
  - category_id: ultrasound_breast
    parent_category_id: ultrasound
    # 부위 확정한 검사(유방)는 소아 분할보다 먼저 평가한다 (ultrasound_ped 에 유방 자식 없음)
    priority: 0
    conditions:
      - operator: not_equals
        field: assign
        value: 'Pediatrics'
      - logic: OR
        conditions:
          - operator: greaterThan
            field: age
            value: 16
          - operator: is_null
            field: age
      - logic: OR
        conditions:
          - operator: equals
            field: assign
            value: 'Breast'
          - operator: contains_any
            field: exam_name
            value: ['breast', 'axilla', '유방']
  - category_id: ultrasound_doppler
    parent_category_id: ultrasound
    # 도플러는 검사기법이며 부위 분류와 독립되므로 소아 분할보다 먼저 평가한다
    priority: 0
    conditions:
      # priority 0이라 ultrasound_ped(1)보다 먼저 평가된다. 소아 도플러 초음파는
      # ultrasound_ped_doppler 로 따로 보내므로 여기서 걸러 낸다.
      - operator: not_equals
        field: assign
        value: 'Pediatrics'
      - logic: OR
        conditions:
          - operator: greaterThan
            field: age
            value: 16
          - operator: is_null
            field: age
      - operator: contains_any
        field: exam_name
        value: ['doppler', '도플러', 'carotid', '혈관']
      - operator: not_contains_any
        field: exam_name
        value:
          [
            'thyroid',
            'parathyroid',
            '갑상선',
            '부갑상선',
            'kidney',
            'scrot',
            'transplanted organ',
            'salivary',
            '침샘'
          ]
  - category_id: ultrasound_ped
    parent_category_id: ultrasound
    priority: 1
    # 나이 우선 원칙: xray_ped / ct_ped / mri_ped / ultrasound_ped / fluoroscopy_ped 동일
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: not_null
                field: age
              - operator: lessThan
                field: age
                value: 17
          - logic: AND
            conditions:
              - operator: is_null
                field: age
              - operator: contains_any
                field: assign
                value: ['Pediatrics', 'PED']
  - category_id: ultrasound_ped_head
    parent_category_id: ultrasound_ped

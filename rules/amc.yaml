  - category_id: mri_ped
    parent_category_id: mri
    priority: 1
    # 나이 우선 원칙: xray_ped / ct_ped / mri_ped / ultrasound_ped / fluoroscopy_ped 동일
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: not_null
                field: age
              - operator: lessThan
                field: age
                value: 17
          - logic: AND
            conditions:
              - operator: is_null
                field: age
              - operator: contains_any
                field: assign
                value: ['Pediatrics', 'PED']
  - category_id: mri_ped_neu
    parent_category_id: mri_ped
    inherit_conditions_from: mri_neu
  - category_id: mri_ped_abd
    parent_category_id: mri_ped
    inherit_conditions_from: mri_abd
  - category_id: mri_ped_spine
    parent_category_id: mri_ped

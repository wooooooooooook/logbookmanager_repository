    inherit_conditions_from: ultrasound_abd
  - category_id: ultrasound_ped_gu
    parent_category_id: ultrasound_ped
    inherit_conditions_from: ultrasound_gu
  - category_id: ultrasound_ped_msk
    parent_category_id: ultrasound_ped
    inherit_conditions_from: ultrasound_msk
  # 성인 갑상선/유방/도플러 규칙은 priority 0이라 소아 분할(priority 1)보다 먼저
  # 평가된다. 그래서 소아 하위에도 같은 조건의 규칙을 두고, 성인 규칙에서 소아
  # 판독실/미만 나이를 제외해 두어야 소아 행이 성인 카테고리로 새지 않는다.
  - category_id: ultrasound_ped_thyroid
    parent_category_id: ultrasound_ped
    priority: 0
    conditions:
      - operator: contains_any
        field: exam_name
        value: ['thyroid', 'parathyroid', '갑상선', '부갑상선']
      - operator: not_contains_any
        field: exam_name
        value: ['aspiration', 'biopsy', '생검', '흡인']
  - category_id: ultrasound_ped_breast
    parent_category_id: ultrasound_ped
    priority: 0
    conditions:
      - logic: OR
        conditions:
          - operator: equals
            field: assign
            value: 'Breast'
          - operator: contains_any
            field: exam_name
            value: ['breast', 'axilla', '유방']
  - category_id: ultrasound_ped_doppler
    parent_category_id: ultrasound_ped
    # 도플러는 검사기법이라 부위와 독립이다. 소아에서도 성인과 같은 우선순위로 본다.
    priority: 0
    conditions:
      - operator: contains_any
        field: exam_name
        value: ['doppler', '도플러', 'carotid', '혈관']
      - operator: not_contains_any
        field: exam_name
        value:
          [
            'thyroid',
            'parathyroid',
            '갑상선',
            '부갑상선',
            'kidney',
            'scrot',
            'transplanted organ',
            'salivary',
            '침샘'
          ]
  - category_id: ultrasound_ped_etc

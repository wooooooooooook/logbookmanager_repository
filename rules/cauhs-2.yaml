              [
                'brain',
                'stroke',
                'cranial',
                'neck',
                'orbit',
                'sella',
                'head',
                'pns',
                'moyamoya',
                'nasopharyn'
              ]
      - operator: not_contains
        field: exam_name
        value: 'SPINE'
      - operator: not_contains_any
        field: assign
        value: ['ABD', 'MAM', 'CHT', 'MSK']
      - operator: not_contains_any
        field: exam_name
        value:
          [
            'breast',
            'chest',
            'liver',
            'biliary',
            'pancreas',
            'rectum',
            'enterography',
            'abdomen',
            'pelvis',
            'kidney',
            'scrotum',
            'prostate',
            'bladder'
          ]
  - category_id: mri_cht
    parent_category_id: mri
    # 흉부 MRI. mri_neu(10)·mri_abd(10)보다 먼저, mri_msk(3)보다도 빠르게
    # 평가되어야 'CHT 판독실 + chest' 행이 근골격으로 새지 않는다.
    priority: 2
    conditions:
      - logic: OR
        conditions:
          - operator: contains_any
            field: assign
            value: ['CHT', 'chest lung']
          - operator: contains_any
            field: exam_name
            value: ['chest', 'thorax', 'pulmonary embolism']
      - operator: not_contains
        field: exam_name
        value: 'SPINE'
      - operator: not_contains_any
        field: exam_name
        value: ['breast', 'aortic', 'aorta', 'angiography', 'pulmonary vein']
      # 유방 판독실이 읽은 'MR,Thorax' 는 흉부가 아니라 유방 MRI다
      - operator: not_contains_any
        field: assign
        value: ['Breast', 'MAM']
  - category_id: mri_vas
    parent_category_id: mri
    # 혈관 MRI. 두경부 MRA/MRV·경동맥은 신경두경부(neuroradiology) 판독이므로
    # 제외한다. 담도조영(cholangiography)은 복부 MRI다.
    # 판독실(VAS)은 심장 MRI와 공유라 조건으로 쓰지 않고 검사명만 본다.
    priority: 2
    conditions:
      - operator: contains_any
        field: exam_name
        value:
          [
            'aortic',
            'aorta',
            'angiography',
            'angiographic',
            'pulmonary vein',
            'venography',
            'arteriography',
            'MRV'
          ]
      - operator: not_contains_any
        field: exam_name
        value:
          [
            'head',
            'brain',
            'cranial',
            'neck',
            'carotid',
            'facial',
            'cholangiography',
            'biliary',
            'pancreas',
            'liver',
            'abdomen',
            'dsa',
            'digital subtraction',
            'heart',
            'cardiac',
            'perfusion'
          ]
      - operator: not_contains
        field: exam_name
        value: 'SPINE'
  - category_id: mri_cardiac
    parent_category_id: mri
    conditions:
      - operator: contains
        field: assign
        value: 'CARDIAC'
  - category_id: mri_abd
    parent_category_id: mri
    conditions:
      - logic: OR
        conditions:
          - operator: contains
            field: assign
            value: 'ABD'
          - operator: contains_any
            field: exam_name
            value: ['liver', 'biliary', 'pancreas', 'abdomen', 'enterography']
      - operator: not_contains_any
        field: exam_name
        value:
          ['pelvis', 'kidney', 'scrotum', 'prostate', 'bladder', '전립선', '신장', '방광', '생식기']
  - category_id: mri_gu
    parent_category_id: mri
    priority: 2
    # 소아 비뇨 MRI 도 이 항목으로 집계한다.
    # (병원 확인: MRI Urography -> "비뇨로분류")
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: contains
                field: exam_name
                value: 'pelvis'
              - operator: not_contains_any
                field: exam_name
                value: ['bone', 'Bone']
          - operator: contains_any
            field: exam_name
            value:
              [
                'urography',
                'urinary',
                'kidney',
                'scrotum',
                'prostate',
                'bladder',
                '전립선',
                '신장',
                '방광',
                '생식기'
              ]
  - category_id: mri_spine
    parent_category_id: mri
    priority: 2
    conditions:
      - operator: contains
        field: exam_name
        value: 'SPINE'
  - category_id: mri_msk
    parent_category_id: mri
    priority: 3
    conditions:
      - logic: OR
        conditions:
          - operator: contains
            field: assign
            value: 'MSK'
          - operator: contains_any
            field: exam_name
            value: ['extremity', 'trauma', 'upper arm', 'lower arm', 'knee', 'elbow']
      - operator: not_contains
        field: exam_name
        value: 'SPINE'
  - category_id: mri_breast
    parent_category_id: mri
    priority: 2
    conditions:
      - logic: OR
        conditions:
          - operator: contains
            field: assign
            value: 'MAM'
          - operator: contains_any
            field: exam_name
            value: ['breast', '유방']
  - category_id: mri_ped
    parent_category_id: mri
    priority: 1
    # 나이 우선 원칙: xray_ped / ct_ped / mri_ped / ultrasound_ped / fluoroscopy_ped 동일
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: not_null
                field: age
              - operator: lessThan
                field: age
                value: 17
          - logic: AND
            conditions:
              - operator: is_null
                field: age
              - operator: contains_any
                field: assign
                value: ['Pediatrics', 'PED']
  - category_id: mri_ped_neu
    parent_category_id: mri_ped
    inherit_conditions_from: mri_neu
  - category_id: mri_ped_abd
    parent_category_id: mri_ped
    inherit_conditions_from: mri_abd
  - category_id: mri_ped_cardiac
    parent_category_id: mri_ped
    inherit_conditions_from: mri_cardiac
  - category_id: mri_ped_gu
    parent_category_id: mri_ped
    inherit_conditions_from: mri_gu
  - category_id: mri_ped_spine
    parent_category_id: mri_ped
    priority: 2
    inherit_conditions_from: mri_spine
  - category_id: mri_ped_msk
    parent_category_id: mri_ped
    priority: 3
    inherit_conditions_from: mri_msk
  - category_id: mri_ped_cht
    parent_category_id: mri_ped
    priority: 2
    inherit_conditions_from: mri_cht
  - category_id: mri_ped_vas
    parent_category_id: mri_ped
    priority: 2
    inherit_conditions_from: mri_vas
  - category_id: mri_ped_breast
    parent_category_id: mri_ped
    priority: 2
    inherit_conditions_from: mri_breast
  - category_id: ultrasound
    conditions:
      - operator: contains
        field: modality
        value: 'US'
      - operator: not_contains_any
        field: exam_name
        value: ['유도', '고주파', 'intussusception']
      - operator: not_contains
        field: modality
        value: 'XA'
  - category_id: ultrasound_ped
    parent_category_id: ultrasound
    priority: 1
    # 나이 우선 원칙: xray_ped / ct_ped / mri_ped / ultrasound_ped / fluoroscopy_ped 동일
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: not_null
                field: age
              - operator: lessThan
                field: age
                value: 17
          - logic: AND
            conditions:
              - operator: is_null
                field: age
              - operator: contains_any
                field: assign
                value: ['Pediatrics', 'PED']
  - category_id: ultrasound_ped_head
    parent_category_id: ultrasound_ped
    inherit_conditions_from: ultrasound_head
  - category_id: ultrasound_ped_abd
    parent_category_id: ultrasound_ped
    inherit_conditions_from: ultrasound_abd
  - category_id: ultrasound_ped_gu
    parent_category_id: ultrasound_ped
    inherit_conditions_from: ultrasound_gu
  - category_id: ultrasound_ped_msk
    parent_category_id: ultrasound_ped
    inherit_conditions_from: ultrasound_msk
  # 성인 갑상선/유방/도플러 규칙은 priority 0이라 소아 분할(priority 1)보다 먼저
  # 평가된다. 그래서 소아 하위에도 같은 조건의 규칙을 두고, 성인 규칙에서 소아
  # 판독실/미만 나이를 제외해 두어야 소아 행이 성인 카테고리로 새지 않는다.
  - category_id: ultrasound_ped_thyroid
    parent_category_id: ultrasound_ped
    priority: 0
    conditions:
      - operator: contains_any
        field: exam_name
        value: ['thyroid', 'parathyroid', '갑상선', '부갑상선']
      - operator: not_contains_any
        field: exam_name
        value: ['aspiration', 'biopsy', '생검', '흡인', '갑상선·부갑상선 제외']
  - category_id: ultrasound_ped_breast
    parent_category_id: ultrasound_ped
    priority: 0
    conditions:
      - logic: OR
        conditions:
          - operator: contains_any
            field: assign
            value: ['Breast', 'MAM']
          - operator: contains_any
            field: exam_name
            value: ['breast', 'axilla', '유방']
      - operator: not_contains_any
        field: exam_name
        value: ['유방·액와부 제외']
  - category_id: ultrasound_ped_doppler
    parent_category_id: ultrasound_ped
    # 도플러는 검사기법이라 부위와 독립이다. 소아에서도 성인과 동일한 우선순위로 본다.
    priority: 0
    conditions:
      - operator: contains_any
        field: exam_name
        value: ['doppler', '도플러', 'carotid', '혈관']
      - operator: not_contains_any
        field: exam_name
        value: ['thyroid', '갑상선', 'scrot', 'penis', '부신', '방광']
  - category_id: ultrasound_ped_etc
    parent_category_id: ultrasound_ped
    # amc / general 과 같이 명시한다. 없으면 런타임이 같은 규칙(priority 999,
    # 조건 없음)을 만들어 쓰므로 결과는 같지만, 파일끼리 모양이 어긋나지 않게 한다.
    priority: 999
    conditions: []
  - category_id: ultrasound_head
    parent_category_id: ultrasound
    conditions:
      - logic: OR
        conditions:
          - operator: contains_any
            field: assign
            value: ['NEU', 'H&N']
          - operator: contains_any
            field: exam_name
            value: ['brain', 'neck', 'orbit', 'sella', 'head', 'salivary']
      - operator: not_contains_any
        field: exam_name
        value: ['penis', 'scrot', '생식기', 'abdomen doppler', 'carotid doppler', 'color doppler']
  - category_id: ultrasound_thyroid
    parent_category_id: ultrasound
    conditions:
      # priority 가 없어서 소아 분할(priority 1)이 먼저 평가된다. 그래도 성인
      # 갑상선은 만 17세 미만이면 소아 갑상선으로 넘긴다.
      - operator: not_equals
        field: assign
        value: 'Pediatrics'
      - logic: OR
        conditions:
          - operator: greaterThan
            field: age
            value: 16
          - operator: is_null
            field: age
      - operator: contains
        field: exam_name
        value: 'thyroid'
      # '목 US(갑상선 제외)' 는 갑상선 초음파가 아니라 목 초음파다
      - operator: not_contains
        field: exam_name
        value: '갑상선 제외'
  - category_id: ultrasound_abd
    parent_category_id: ultrasound
    conditions:
      - logic: OR
        conditions:
          - operator: contains
            field: assign
            value: 'ABD'
          - operator: contains_any
            field: exam_name
            value: ['appendix', 'colon', 'abdomen', 'hepatic', 'mesenteric', 'bowel', 'inguinal']
      - operator: not_contains_any
        field: exam_name
        value: ['penis', 'scrot', '생식기', 'carotid doppler', 'color doppler']
      # 복강 초음파라도 비뇨생식기 부위가 명시되면 복부가 아니다
      - operator: not_contains_any
        field: exam_name
        value:
          [
            '신장',
            '부신',
            '방광',
            '전립선',
            '자궁',
            '난소',
            '여성생식기',
            '남성생식기',
            'kidney',
            'adrenal',
            'bladder',
            'uterus',
            'ovary',
            'prostate'
          ]
  - category_id: ultrasound_gu
    parent_category_id: ultrasound
    conditions:
      - logic: OR
        conditions:
          - operator: contains_any
            field: assign
            value: ['OBGY', 'Genitourinary']
          # 'URO' 는 'Neuro' 의 부분문자열이므로 코드는 정확히 일치시켜야 한다
          - operator: equals_any
            field: assign
            value: ['URO', 'GU', 'UROLOGY']
          - operator: contains_any
            field: exam_name
            value:
              [
                'penis',
                'scrot',
                '생식기',
                '신장',
                '부신',
                '방광',
                '전립선',
                '자궁',
                '난소',
                'kidney',
                'adrenal',
                'bladder',
                'uterus',
                'ovary',
                'prostate'
              ]
  - category_id: ultrasound_msk
    parent_category_id: ultrasound
    conditions:
      - operator: not_contains_any
        field: exam_name
        value: ['abi', 'pwv', 'tbi']
      - logic: OR
        conditions:
          - operator: contains
            field: assign
            value: 'MSK'
          - operator: contains_any
            field: exam_name
            value:
              [
                'spine',
                'soft tissue',
                'extremity',
                'pelvis',
                'trauma',
                'foot',
                'ankle',
                'knee',
                'hip',
                'shoulder',
                'elbow',
                'wrist',
                'hand',
                'bone',
                'musculo',
                'skeletal',
                'meniscus'
              ]
  - category_id: ultrasound_breast
    parent_category_id: ultrasound
    # 부위 확정한 검사(유방)는 소아 분할보다 먼저 평가한다
    priority: 0
    conditions:
      # 소아 판독실은 소아 유방 초음파가 있으므로 성인 유방으로 잡지 않는다
      - operator: not_equals
        field: assign
        value: 'Pediatrics'
      - logic: OR
        conditions:
          - operator: greaterThan
            field: age
            value: 16
          - operator: is_null
            field: age
      - logic: OR
        conditions:
          - operator: contains_any
            field: assign
            value: ['Breast', 'MAM']
          - operator: contains_any
            field: exam_name
            value: ['breast', 'axilla', '유방']
      - operator: not_contains_any
        field: exam_name
        value: ['유방·액와부 제외']
  - category_id: ultrasound_doppler
    parent_category_id: ultrasound
    # 도플러는 검사기법이며 부위 분류와 독립되므로 소아 분할보다 먼저 평가한다
    priority: 0
    conditions:
      # 소아 도플러 초음파는 ultrasound_ped_doppler 로 따로 보낸다
      - operator: not_equals
        field: assign
        value: 'Pediatrics'
      - logic: OR
        conditions:
          - operator: greaterThan
            field: age
            value: 16
          - operator: is_null
            field: age
      - operator: contains_any
        field: exam_name
        value: ['doppler', '도플러', 'carotid', '혈관']
      - operator: not_contains_any
        field: exam_name
        value:
          ['thyroid', '갑상선', 'scrot', 'penis', '부신', '방광', 'IMT Carotid', 'Abdomen Doppler']
  - category_id: fluoroscopy
    priority: 3
    conditions:
      - operator: not_contains
        field: exam_name
        value: 'Arthro CT'
      - logic: OR
        conditions:
          - operator: contains_any
            field: modality
            value: ['RF', 'FLUORO', 'DF']
          # 바륨/조영제 GI Series 는 PACS 검사종류가 단순촬영(CR)이어도 투시 검사다
          - operator: contains_any
            field: exam_name
            value:
              [
                'small bowel series',
                'upper gi series',
                'barium',
                'enema',
                'colon study',
                'esophago',
                'gastro'
              ]
  - category_id: fluoroscopy_abd
    parent_category_id: fluoroscopy
    conditions:
      - logic: OR
        conditions:
          - operator: contains
            field: assign
            value: 'ABD'
          - operator: contains_any
            field: exam_name
            value: ['colon study', 'small bowel', 'upper gi', 'abdomen study', 'barium']
      - operator: not_contains
        field: exam_name
        value: 'Arthro CT'
  - category_id: fluoroscopy_gu
    parent_category_id: fluoroscopy
    # 요로 조영은 복부 조영보다 먼저 평가한다 (AGP 등 판독실이 복부인 경우)
    priority: 2
    conditions:
      - logic: OR
        conditions:
          - operator: contains_any
            field: assign
            value: ['OBGY', 'Genitourinary']
          - operator: equals_any
            field: assign
            value: ['URO', 'GU', 'UROLOGY']
          - operator: contains_any
            field: exam_name
            value: ['urography', 'pyelography', 'genitography', 'AGP', 'VCUG']
  - category_id: fluoroscopy_ped
    parent_category_id: fluoroscopy
    priority: 1
    # 나이 우선 원칙: xray_ped / ct_ped / mri_ped / ultrasound_ped / fluoroscopy_ped 동일
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: not_null
                field: age
              - operator: lessThan
                field: age
                value: 17
          - logic: AND
            conditions:
              - operator: is_null
                field: age
              - operator: contains_any
                field: assign
                value: ['Pediatrics', 'PED']

  # 투시 소아 비고
  - category_id: fluoroscopy_ped_abd
    parent_category_id: fluoroscopy_ped
    inherit_conditions_from: fluoroscopy_abd
  - category_id: fluoroscopy_ped_gu
    parent_category_id: fluoroscopy_ped
    inherit_conditions_from: fluoroscopy_gu
  - category_id: fluoroscopy_ped_etc
    parent_category_id: fluoroscopy_ped
    inherit_conditions_from: fluoroscopy_etc
    priority: 999
  - category_id: fluoroscopy_etc
    parent_category_id: fluoroscopy
    conditions: []
    priority: 999

  - category_id: intervention
    priority: 1
    composed_by_subcategories: true
    # 하위 카테고리로만 구성되므로 conditions는 무시됨
  - category_id: intervention_neu
    parent_category_id: intervention
    conditions:
      - operator: contains_any
        field: exam_name
        value:
          [
            '뇌혈관조영술',
            'Vessel Angiography',
            'Internal Carotid Angiography',
            '신경중재',
            '총경동맥',
            'Common carotid',
            'carotid angiography',
            '뇌동맥류',
            'Flow diverter'
          ]
      # 검사명에 CT가 명시된 경우("CT,Head angiography")는 CT 혈관조영이다
      - operator: regex
        field: exam_name
        value: '^(?:(?!.*\bct\b)[\s\S])*$'
        regex_flags: 'i'
  - category_id: intervention_thyroid
    parent_category_id: intervention
    conditions:
      - operator: contains_any
        field: exam_name
        value: ['갑상선', 'thyroid']
      - operator: contains_any
        field: exam_name
        value: ['침생검', '세침흡인술', '흡인생검', '생검', '흡인', 'biopsy', 'aspiration']
  - category_id: intervention_us
    parent_category_id: intervention
    conditions:
      - operator: contains
        field: modality
        value: 'US'
      - operator: contains_any
        field: exam_name
        value: ['생검', '조직검사', 'Biopsy', 'aspiration', '흡인']
  - category_id: intervention_ct
    parent_category_id: intervention
    conditions:
      - operator: contains
        field: modality
        value: 'CT'
      - operator: contains_any
        field: exam_name
        value: ['생검', '조직검사']
  - category_id: intervention_intu
    parent_category_id: intervention
    conditions:
      - operator: contains
        field: exam_name
        value: 'intussusception'
  - category_id: intervention_cfa
    parent_category_id: intervention
    conditions:
      - operator: contains
        field: exam_name
        value: '대퇴동맥천자술'
  - category_id: intervention_angio
    parent_category_id: intervention
    conditions:
      - operator: contains
        field: modality
        value: 'XA'
      - operator: contains_any
        field: exam_name
        value:
          [
            'embolization',
            'arteriography',
            'transluminal angioplasty',
            'TACE',
            'TACI',
            'UAE',
            'BAE',
            'aortography',
            'Angiography',
            '혈관조영'
          ]
      # 검사명에 CT가 명시된 경우("Angiographic CT")는 시술이 아닌 CT 혈관조영이다
      - operator: regex
        field: exam_name
        value: '^(?:(?!.*\bct\b)[\s\S])*$'
        regex_flags: 'i'
  - category_id: intervention_biliary
    parent_category_id: intervention
    conditions:
      - operator: contains
        field: modality
        value: 'XA'
      - operator: contains_any
        field: exam_name
        value: ['transhepatic', 'cholecystostomy', 'biliary']
  - category_id: intervention_pcn
    parent_category_id: intervention
    conditions:
      - operator: contains
        field: modality
        value: 'XA'
      - operator: contains
        field: exam_name
        value: 'nephrostomy'
  - category_id: intervention_drain
    parent_category_id: intervention
    conditions:
      - operator: contains_any
        field: exam_name
        value: ['drain', '복막천자', '흉막천자', '초음파유도', '초음파 유도']
      - operator: not_contains_any
        field: exam_name
        value: ['nephrostomy', 'transhepatic', 'cholecystostomy']
  - category_id: intervention_cvc
    parent_category_id: intervention
    # PICC/중심정맥 카테터는 검사명에 "혈관조영술"이 함께 붙어 있어
    # intervention_angio 보다 먼저 평가해야 한다
    priority: 2
    conditions:
      - operator: contains
        field: modality
        value: 'XA'
      - operator: contains_any
        field: exam_name
        value:
          [
            '중심정맥',
            '쇄골하정맥',
            'Placement Of Cvc',
            'PICC',
            'Central Vein Catheter',
            'Catheterization',
            'Hemodialysis',
            'Hickman',
            'Permcath',
            'Chemo Port'
          ]
  - category_id: intervention_tumor
    parent_category_id: intervention
    conditions:
      - operator: contains_any
        field: exam_name
        value:
          [
            '고주파',
            '마이크로웨이브',
            'HIFU',
            '경화',
            '경화술',
            'Sclerotherapy',
            'sclerotherapy',
            'RFA'
          ]
      - operator: not_contains_any
        field: exam_name
        value: ['혈관기형', 'malformation', 'Malformation', 'AVM']
  - category_id: intervention_etc
    parent_category_id: intervention
    priority: 999
    conditions:
      - operator: contains
        field: modality
        value: 'XA'
      - operator: not_contains
        field: modality
        value: 'XA/CR'
      - operator: not_contains_any
        field: exam_name
        value: ['Simple US', 'Guiding US', 'Skull']
      # 검사명에 CT가 명시된 경우("Angiographic CT")는 시술이 아닌 CT 혈관조영이다
      - operator: regex
        field: exam_name
        value: '^(?:(?!.*\bct\b)[\s\S])*$'
        regex_flags: 'i'
  - category_id: nuclearmedicine
    composed_by_subcategories: true
  - category_id: nuclearmedicine_pet
    parent_category_id: nuclearmedicine
    conditions:
      - operator: contains
        field: modality
        value: 'PT'
  - category_id: nuclearmedicine_other
    parent_category_id: nuclearmedicine
    conditions:
      - operator: contains
        field: modality
        value: 'NM'
      - operator: not_contains
        field: modality
        value: 'PT'

drop_rules:
  - name: 'BD 검사 제외'
    description: '검사종류(modality)가 BD인 데이터는 ML 분류 대상에서 제외'
    field: modality
    operator: equals
    value: 'BD'

# CSV/Excel 내보내기 설정
export_as_sheet:
  default_format: 'csv' # 기본 내보내기 형식
  encoding: 'utf-8' # 파일 인코딩
  filename:
    pattern: 'logbook_export_{date}_{time}'
    date_format: 'YYYY-MM-DD'
    time_format: 'HH-mm-ss'
  templates:
    - name: 'for_record2'
      export_site: record2
      description: 'record2 사이트 업로드용 (예시 엑셀 파일과 동일한 구조)'
      column_order:
        - 'serial_number'
        - 'modality'
        - 'specialty'
        - 'sex'
        - 'study_date'
        - 'reading_date'
        - 'exam_name'

      columns:
        - serial_number:
            name: '일련번호'
            type: 'number'
            width: 8
            value:
              auto_increment:
                start_value: 1
                increment: 1
        - modality:
            name: '검사종류'
            type: 'string'
            width: 12
            value:
              from_metadata:
                key: examination_type_name
            is_classifier: true
            map_to_export_target: true
        - specialty:
            name: '세부전공'
            type: 'string'
            width: 12
            value:
              conditional:
                conditions:
                  - condition:
                      field: 'specialty_name'
                      operator: 'is_null'
                    value_source:
                      from_metadata:
                        key: 'examination_type_name'
                default:
                  from_metadata:
                    key: 'specialty_name'
            is_classifier: true
            map_to_export_target: true
        - sex:
            name: '환자성별(M/F)'
            type: 'string'
            width: 8
            value:
              fallback_chain:
                - from_field:
                    field: 'sex'
                - static:
                    value: "N/A"
        - study_date:
            name: '검사일(년-월-일)'
            type: 'date'
            width: 12
            date_format: 'YYYY-MM-DD'
            value:
              from_field:
                field: 'study_date'
        - reading_date:
            name: '판독일(년-월-일)'
            type: 'date'
            width: 12
            date_format: 'YYYY-MM-DD'
            value:
              from_field:
                field: 'reading_date'
        - exam_name:
            name: '검사명'
            type: 'string'
            width: 20
            value:
              fallback_chain:
                - from_field:
                    field: 'exam_name'
                - static:
                    value: '검사명 없음'
      ajax_template: |
        $.ajax({
          url: "/major/reading/handle/reading_A_upsert.php",
          type: "POST",
          data: {
            sid: "",
            gubun: {{modality}},
            kind: {{specialty}},
            reading_count: {{count}},
            sdate: "{{start_date}}",
            edate: "{{end_date}}"
          },
          dataType: "text",
          success: function(e) {
            console.log("{{modality}} | {{specialty}} 업로드 완료");
          }
        });

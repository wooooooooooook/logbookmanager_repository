                    field: assign
                    value: 'ABD'
                  - operator: contains_any
                    field: exam_name
                    value: ['abdomen', 'liver', 'biliary', 'pancreas', 'enterography']
              - operator: not_contains_any
                field: department
                value:
                  [
                    'NE',
                    'UR',
                    'OB',
                    '신장내과',
                    '비뇨의학과',
                    '산부인과',
                    'PUR',
                    'P-UR',
                    '소아비뇨의학과',
                    '소아비뇨기과'
                  ]
          # 검사명이 간/담낭/췌장 등 상복부 장기를 지목하면 의뢰과와 무관하게 복부 CT다
          # (병원 확인: "CT Reading Outside Films(Abdomen)" -> "복부")
          - operator: contains_any
            field: exam_name
            value:
              [
                'abdomen',
                'liver',
                'biliary',
                'pancreas',
                'spleen',
                '간',
                '담낭',
                '담도',
                '췌장',
                '비장'

                    'UR',
                    'OB',
                    '신장내과',
                    '비뇨의학과',
                    '산부인과',
                    'PUR',
                    'P-UR',
                    '소아비뇨의학과',
                    '소아비뇨기과'
                  ]
          - operator: contains_any
            field: exam_name

column_mapping:
  required:
    - name: '고유번호'
      field: 'id'
      type: 'string'
      aliases: ['STUDY KEY', 'STUDY_KEY', 'id', '일렬번호']
      description: '로그북 데이터의 고유 식별자'
    - name: '검사종류'
      field: 'modality'
      type: 'string'
      aliases: ['modality']
      description: '검사의 종류 (예: 일반촬영, CT, MRI)'
      search_set: true
    - name: '검사명'
      field: 'exam_name'
      type: 'string'
      aliases: ['DESCRIPTION', 'ORDER_NAME', 'Protocol Name', 'Exam Name', '검사명']
      description: '수행된 검사의 상세 이름'
      search_set: true
    - name: '의뢰부서'
      field: 'department'
      type: 'string'
      aliases: ['DEPT', 'ORDER_DEPT', 'Department', '부서']
      description: '검사를 의뢰한 부서'
      search_set: true
    - name: '판독실'
      field: 'assign'
      type: 'string'
      aliases: ['STUDY_ASSIGN', 'STUDY ASSIGN', 'Section', 'GROUP1', 'Assign']
      description: '검사 담당 전문의 구분'
      search_set: true
    - name: '나이'
      field: 'age'
      type: 'number'
      parser: 'age'
      aliases: ['AGE', 'PATIENT_AGE', 'Age']
      description: '환자의 나이'
    - name: '판독일'
      field: 'reading_date'
      type: 'date'
      parser: 'date'
      format: 'YYYY-MM-DD'
      aliases: ['DRAFT DATE', 'Report Date', 'draft_date', 'CREATE_DATE', '판독일(년-월-일)']
      description: '판독 보고서가 작성된 날짜'
  optional:
    - name: '환자성별'
      field: 'sex'
      type: 'enum'
      values: ['M', 'F', '']
      parser: 'gender'
      aliases: ['SEX', 'PATIENT_SEX', '환자성별(M/F)']
      description: '환자의 성별 (M 또는 F)'
    - name: '검사일'
      field: 'study_date'
      type: 'date'
      parser: 'date'
      format: 'YYYY-MM-DD'
      aliases: ['STUDY DATE', 'Study DateTime', 'STUDY_DATE', 'Exam Date(Time)', '검사일(년-월-일)']
      description: '검사가 수행된 날짜'
  default_order:
    - 'reading_date'
    - 'modality'
    - 'exam_name'
    - 'department'
    - 'assign'
    - 'sex'
    - 'age'


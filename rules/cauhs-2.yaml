                '(Uro)',
                ' uro',
                '요로',
                '결석',
                '신장',
                '방광',
                '전립선',
                '신우'
              ]
      # 의뢰과가 비뇨생식기과라도 검사명이 간/담낭/췌장 등 복부 장기를 지목하면 복부 CT다
      - operator: not_contains_any
        field: exam_name
        value: ['liver', 'biliary', 'pancreas', 'spleen', '간', '담낭', '담도', '췌장', '비장']
  - category_id: ct_spine
    parent_category_id: ct
    priority: 2
    conditions:
      - operator: contains
        field: exam_name
        value: 'SPINE'
  - category_id: ct_msk
    parent_category_id: ct
    conditions:
      - logic: OR
        conditions:
          - operator: contains
            field: assign
            value: 'MSK'
          - operator: contains_any
            field: exam_name
            value:
              ['extremity', 'pelvis', 'trauma', 'upper arm', 'lower arm', 'knee', 'elbow', 'arthro']
      - operator: not_contains
        field: exam_name
        value: 'SPINE'
  - category_id: ct_ped
    parent_category_id: ct
    priority: 1
    # 나이 우선 원칙: xray_ped / ct_ped / mri_ped / ultrasound_ped / fluoroscopy_ped 동일
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: not_null
                field: age
              - operator: lessThan
                field: age
                value: 17
          - logic: AND
            conditions:
              - operator: is_null
                field: age
              - operator: contains_any
                field: assign
                value: ['Pediatrics', 'PED']

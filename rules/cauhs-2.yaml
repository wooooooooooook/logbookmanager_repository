# 분류 기준 정의
classification_rules:
  - category_id: xray
    conditions:
      - operator: contains_any
        field: modality
        value: ['CR', 'DR', 'DX', 'XA/CR']
  - category_id: xray_neu
    parent_category_id: xray
    # 판독실이 기준이다. 다만 명백한 근골격 X-ray 는 근골격으로 보낸다.
    # (병원 확인: "assign을 기준으로 보는것이 맞음" + "NEU라도 명백한 msk는 msk로분류")
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: contains_any
                field: assign
                value: ['H&N', 'NEU']
              - operator: not_contains_any
                field: exam_name
                value:
                  [
                    'Chest',
                    'Abdomen',
                    'Spine',
                    'ankle',
                    'shoulder',
                    'clavicle',
                    'humerus',
                    'joint',
                    'elbow',
                    'femur',
                    'foot',
                    'forearm',
                    'wrist',
                    'hand',
                    'finger',
                    'hip',
                    'knee',
                    'leg',
                    'pelvis',
                    'rib',
                    'coccyx',
                    'extremity',
                    'toe'
                  ]
          - operator: contains_any
            field: exam_name
            value:
              [
                'skull',
                'neck',
                'pns',
                'mastoid',
                't - m joint',
                't-m joint',
                'tm joint',
                'tmj',
                'mandible'
              ]
      - operator: not_contains
        field: exam_name
        value: 'spine'
  - category_id: xray_cht
    parent_category_id: xray
    conditions:
      # 소아 판독실(PED)에는 부위별 판독실이 없으므로 검사명으로 부위를 판단한다
      - logic: OR
        conditions:
          - operator: contains
            field: assign
            value: 'CHT'
          - operator: contains_any
            field: exam_name
            value: ['chest', 'thorax']
  - category_id: xray_abd
    parent_category_id: xray
    conditions:
      - logic: OR
        conditions:
          - operator: contains
            field: assign
            value: 'ABD'
          - operator: contains_any
            field: exam_name
            value: ['abdomen', 'abdominal']
      - operator: not_contains_any
        field: exam_name
        value: ['KUB', 'K.U.B']
  - category_id: xray_kub
    parent_category_id: xray
    priority: 2
    conditions:
      - operator: contains_any
        field: exam_name
        value: ['KUB', 'K.U.B']
  - category_id: xray_spine
    parent_category_id: xray
    priority: 2
    conditions:
      - operator: contains_any
        field: exam_name
        value: ['Spine', 'C-spine', 'T-spine', 'L-spine', 'atlas', 'SPINE']
  - category_id: xray_msk
    parent_category_id: xray
    conditions:
      # Infantogram(신생아 전신)은 근골격으로 잡지 않고 기타로 보낸다
      - operator: not_contains
        field: exam_name
        value: 'infantogram'
      - logic: OR
        conditions:
          - operator: contains
            field: assign
            value: 'MSK'
          - operator: contains_any
            field: exam_name
            value:
              [
                'ankle',
                'shoulder',
                'clavicle',
                'humerus',
                'joint',
                'elbow',
                'femur',
                'foot',
                'forearm',
                'wrist',
                'hand',
                'finger',
                'hip',
                'knee',
                'leg',
                'pelvis',
                'rib',
                'coccyx',
                'extremity',
                'whole skeletal',
                'teleradiogram',
                'toe',
                'Sacrum',
                'sacrum'
              ]
      - operator: not_contains
        field: exam_name
        value: 'spine'
  - category_id: xray_ped
    parent_category_id: xray
    priority: 1
    # 나이 우선 원칙: 나이가 있으면 나이를, 결측일 때만 판독실을 본다
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: not_null
                field: age
              - operator: lessThan
                field: age
                value: 17
          - logic: AND
            conditions:
              - operator: is_null
                field: age
              - operator: contains_any
                field: assign
                value: ['Pediatrics', 'PED']
  - category_id: xray_ped_neu
    parent_category_id: xray_ped
    inherit_conditions_from: xray_neu
  - category_id: xray_ped_cht
    parent_category_id: xray_ped
    inherit_conditions_from: xray_cht
    conditions:
      - operator: not_contains
        field: exam_name
        value: 'Infantogram'
  - category_id: xray_ped_abd
    parent_category_id: xray_ped
    inherit_conditions_from: xray_abd
    conditions:
      - operator: not_contains
        field: exam_name
        value: 'Infantogram'
  - category_id: xray_ped_kub
    parent_category_id: xray_ped
    # inherit_conditions_from 은 조건만 상속하므로 priority는 직접 지정해야 한다
    priority: 2
    inherit_conditions_from: xray_kub
  - category_id: xray_ped_spine
    parent_category_id: xray_ped
    priority: 2
    inherit_conditions_from: xray_spine
  - category_id: xray_ped_msk
    parent_category_id: xray_ped
    inherit_conditions_from: xray_msk

  - category_id: mammography
    priority: 2
    composed_by_subcategories: true
  - category_id: mammography_mammography
    parent_category_id: mammography
    conditions:
      - operator: equals
        field: modality
        value: 'MG'
  - category_id: ct
    conditions:
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - operator: contains
                field: modality
                value: 'CT'
              - operator: not_contains
                field: modality
                value: 'PT'
          # PACS 검사종류가 범용 코드(DS 등)라도 검사명에 CT가 명시되어 있으면 CT로 본다
          - operator: regex
            field: exam_name
            value: '\bct\b'
            regex_flags: 'i'
      # PET-CT 는 CT 항목이 아니라 핵의학과(PET) 항목이다.
      # (병원 확인: "(FDG) Torso PET-CT" -> "nm_pet으로")
      - operator: not_contains
        field: exam_name
        value: 'PET'
  - category_id: ct_neu
    parent_category_id: ct
    conditions:
      - logic: OR
        conditions:
          - operator: contains_any
            field: assign
            value: ['H&N', 'NEU']
          - operator: contains
            field: exam_name
            value: 'thyroid'
          - operator: contains_any
            field: exam_name
            value: ['brain', 'head', 'neck', 'orbit', 'OMU', 'PNS', 'cranial', 'facial', 'temporal']
      - operator: not_contains
        field: exam_name
        value: 'SPINE'
  - category_id: ct_cht
    parent_category_id: ct
    conditions:
      - logic: OR
        conditions:
          - operator: contains
            field: assign
            value: 'CHT'
          - operator: contains_any
            field: exam_name
            value: ['chest', 'pulmonary embolism']
  - category_id: ct_cardiac
    parent_category_id: ct
    conditions:
      - operator: contains
        field: assign
        value: 'CARDIAC'
  - category_id: ct_vas
    parent_category_id: ct
    # TAVI 등 판독실이 흉부/심장인 혈관조영 CT도 혈관 CT로 집계한다.
    # (병원 확인: "vas가 맞음") 심장 CT(6) 보다 먼저 평가되어야 한다.
    priority: 5
    conditions:
      - logic: OR
        conditions:
          - operator: contains
            field: assign
            value: 'VAS'
          - operator: contains_any
            field: exam_name
            value: ['aortic', 'aorta', 'angiography', 'angiographic', 'venography']
      # 두부 혈관조영은 신경두경부 CT로 집계한다
      - operator: not_contains_any
        field: exam_name
        value: ['head', 'brain', 'cranial', 'neck', 'carotid']
  - category_id: ct_abd
    parent_category_id: ct
    conditions:
      - operator: not_contains_any
        field: exam_name
        value: ['(uro)', '(Uro)']
      - logic: OR
        conditions:
          - logic: AND
            conditions:
              - logic: OR
                conditions:
